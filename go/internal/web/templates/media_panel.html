{{/* 媒体库面板(对齐 vidonex PanelsMediaLibrary):
    双模式 —— 未打开项目 = 项目列表;已打开 = 项目媒体库(上传/搜索/拖拽入时间轴)。 */}}
<div class="h-full w-full flex flex-col bg-gray-950 border-r border-gray-800 select-none relative transition-colors"
     :class="isDraggingOver ? 'bg-indigo-950/20 ring-2 ring-inset ring-indigo-500/40' : ''"
     x-data="mediaLibrary({{if .Project}}{{.Project.ID}}{{else}}null{{end}})"
     @dragover.prevent="isDraggingOver = true"
     @dragleave.prevent="if (!$event.currentTarget.contains($event.relatedTarget)) isDraggingOver = false"
     @drop.prevent="uploadDrop($event)">
  <!-- 自定义拖拽徽章(对齐 vidonex sleek drag ghost:fixed 顶层,setDragImage 用) -->
  <div x-ref="dragGhost" class="fixed -top-[9999px] left-0 pointer-events-none flex items-center gap-2 px-3 py-1.5 bg-gray-900 text-white rounded-full shadow-2xl border border-indigo-400 text-xs font-medium z-[9999]">
    <div class="w-5 h-5 rounded-full overflow-hidden flex items-center justify-center bg-indigo-950 border border-indigo-400/50 flex-shrink-0">
      <svg x-show="dragGhostAsset && dragGhostAsset.thumbnail_url" class="w-full h-full" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg x-show="!dragGhostAsset || !dragGhostAsset.thumbnail_url" class="w-3.5 h-3.5 text-indigo-400" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <span class="max-w-[130px] truncate text-[11px] font-medium text-gray-100" x-text="dragGhostAsset ? dragGhostAsset.file_name : ''"></span>
    <span class="text-[10px] bg-indigo-500/30 text-indigo-200 px-1.5 py-0.5 rounded-full font-mono uppercase tracking-wider"
          x-text="dragGhostAsset ? dragGhostAsset.file_type : ''"></span>
  </div>
  <!-- Header:folder 图标 + 标题 + 计数徽章;右上 = 视图切换 + 上传(对齐 vidonex MediaLibrary header) -->
  <div class="p-2.5 border-b border-gray-800 flex items-center justify-between gap-2 bg-gray-950/40 flex-shrink-0">
    <div class="flex items-center gap-1.5 min-w-0">
      <svg class="w-4 h-4 text-indigo-400 flex-shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <template x-if="!pid">
        <span class="text-xs font-semibold tracking-wider text-gray-300 truncate">媒体库</span>
      </template>
      <template x-if="pid">
        <span class="text-xs font-semibold tracking-wider text-gray-300 truncate">媒体库</span>
      </template>
      <span class="text-[10px] font-mono px-1.5 rounded-full bg-gray-800 text-gray-400 border border-gray-700/60 flex-shrink-0"
            x-text="pid ? assets.length : {{len .Projects}}"></span>
    </div>
    <div class="flex items-center gap-1.5 flex-shrink-0" x-show="pid">
      <!-- 上传按钮(参考物理位置:最左;对齐 vidonex UButton xs primary soft) -->
      <label class="flex items-center gap-1 px-2 py-1 rounded-md bg-indigo-500/20 text-indigo-300 hover:bg-indigo-500/30 text-[11px] cursor-pointer transition flex-shrink-0"
             :class="uploading ? 'opacity-50 pointer-events-none' : ''">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 16V4m0 0l-4 4m4-4l4 4M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        <span x-text="uploading ? '上传中…' : '上传素材'"></span>
        <input x-ref="fileInput" type="file" class="hidden" multiple @change="uploadFiles($event)">
      </label>
      <!-- 视图切换:网格 → 树(参考物理顺序:网格中、树右;对齐 vidonex viewMode switcher) -->
      <div class="flex items-center bg-gray-900 border border-gray-800 rounded p-0.5">
        <button type="button" @click="viewMode = 'grid'"
                class="p-1 rounded text-xs transition-colors" :class="viewMode === 'grid' ? 'bg-indigo-600 text-white shadow-sm' : 'text-gray-400 hover:text-gray-200'"
                title="网格视图">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        </button>
        <button type="button" @click="viewMode = 'tree'"
                class="p-1 rounded text-xs transition-colors" :class="viewMode === 'tree' ? 'bg-indigo-600 text-white shadow-sm' : 'text-gray-400 hover:text-gray-200'"
                title="分类树视图">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h6M4 12h6M4 18h6M14 6h6M14 12h6M14 18h6" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 打开项目 → 媒体库模式 -->
  <template x-if="pid">
    <div class="flex flex-col min-h-0 flex-1">
      <!-- 搜索过滤栏(对齐 vidonex fast search filter) -->
      <div class="p-2 border-b border-gray-800/60 flex items-center gap-1.5 bg-gray-950/20 flex-shrink-0">
        <svg class="w-3.5 h-3.5 text-gray-500 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" stroke-linecap="round"/></svg>
        <div class="relative flex-1">
          <input type="text" x-model="query" placeholder="过滤素材…"
                 class="w-full bg-gray-900/60 border border-gray-800 rounded px-2 py-1 text-[11px] text-gray-200 placeholder-gray-600 focus:outline-none focus:border-indigo-500">
          <!-- 搜索清除按钮(对齐 vidonex:query 非空时显示 ×) -->
          <button type="button" x-show="query" @click="query = ''"
                  class="absolute right-1.5 top-1/2 -translate-y-1/2 p-1 rounded text-gray-500 hover:text-gray-200 transition"
                  title="清除搜索">
            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>
          </button>
        </div>

      </div>
      <!-- 素材区:空态 / 分类树 / 网格(对齐 vidonex MediaLibrary 三态) -->
      <div class="flex-1 overflow-y-auto p-2 space-y-1.5 min-h-0">
        <!-- 空态(无素材且无搜索) -->
        <div x-show="assets.length === 0" @click="$refs.fileInput.click()"
             class="text-center py-10 px-4 space-y-3 border border-dashed border-gray-800 rounded-xl m-1 bg-gray-950/30 hover:border-gray-700 transition cursor-pointer">
          <div class="w-10 h-10 rounded-full bg-gray-900 border border-gray-800 flex items-center justify-center mx-auto text-gray-400">
            <svg class="w-5 h-5 text-indigo-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4m0 0l-4 4m4-4l4 4M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <p class="text-xs font-medium text-gray-300">媒体库为空</p>
          <p class="text-[11px] text-gray-500 max-w-[200px] mx-auto leading-relaxed">上传素材,或直接从文件夹拖入本面板</p>
        </div>
        <!-- 搜索无结果 -->
        <div x-show="assets.length > 0 && filtered.length === 0" class="text-center py-8 text-gray-500 text-xs">
          没有匹配的素材
        </div>

        <!-- 分类树视图(对齐 vidonex compact tree:可折叠分类分支 + 计数) -->
        <div x-show="assets.length > 0 && filtered.length > 0 && viewMode === 'tree'" class="space-y-1.5">
          <template x-for="cat in activeCategories()" :key="cat.id">
            <div class="rounded-lg border border-gray-800/60 bg-gray-950/40 overflow-hidden">
              <!-- 分类头(点击折叠) -->
              <div class="flex items-center justify-between px-2.5 py-1.5 hover:bg-gray-800/50 cursor-pointer select-none transition-colors group"
                   @click="toggleCategory(cat.id)">
                <div class="flex items-center gap-1.5 min-w-0">
                  <svg class="w-3.5 h-3.5 text-gray-500 transition-transform duration-200"
                       :class="expanded[cat.id] ? 'rotate-90 text-gray-300' : ''"
                       viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  <span class="text-xs font-semibold tracking-wide truncate" :class="cat.color" x-text="cat.label"></span>
                </div>
                <span class="text-[10px] font-mono px-1.5 py-0.5 rounded-full" :class="cat.badge"
                      x-text="categorized()[cat.id].length"></span>
              </div>
              <!-- 分类子项 -->
              <div x-show="expanded[cat.id]" class="px-1 pb-1 pt-0.5 space-y-0.5">
                <template x-for="a in categorized()[cat.id]" :key="a.id">
                  <div class="group/item flex items-center justify-between px-2 py-1 rounded-md text-xs hover:bg-gray-800/80 border border-transparent hover:border-gray-700/60 cursor-grab active:cursor-grabbing transition-all duration-150"
                       :draggable="true" @dragstart="onDragStart($event, a)"
                       :title="a.file_name + ' · ' + (a.duration_seconds ? a.duration_seconds.toFixed(2) + 's' : '') + ' · ' + a.width + '×' + a.height">
                    <!-- 缩略图/图标 + 文件名 -->
                    <div class="flex items-center gap-2 min-w-0 flex-1 pointer-events-none">
                      <div class="w-5 h-5 rounded overflow-hidden flex-shrink-0 bg-gray-900 border border-gray-800 flex items-center justify-center">
                        <template x-if="a.thumbnail_url && a.file_type !== 'audio'">
                          <img :src="a.thumbnail_url" class="w-full h-full object-cover">
                        </template>
                        <template x-if="a.file_type === 'audio' || !a.thumbnail_url">
                          <svg class="w-3 h-3 text-emerald-400" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4a1 1 0 0 0 1 1h3l4 4V5L7 9H4a1 1 0 0 0-1 1z"/></svg>
                        </template>
                      </div>
                      <span class="truncate text-[11px] font-medium text-gray-200" x-text="a.file_name"></span>
                    </div>
                    <!-- 元数据 + 操作 -->
                    <div class="flex items-center gap-1.5 flex-shrink-0">
                      <span x-show="a.duration_seconds > 0" class="text-[10px] font-mono text-gray-500"
                            x-text="Math.floor(a.duration_seconds / 60) + ':' + String(Math.floor(a.duration_seconds % 60)).padStart(2, '0')"></span>
                      <div class="flex items-center gap-1 opacity-0 group-hover/item:opacity-100 transition-opacity">
                        <button type="button" @click="openProbeModal(a)" class="p-1 rounded hover:bg-gray-700 text-gray-400 hover:text-gray-200 transition" title="素材详情">
                          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M12 12v4" stroke-linecap="round"/></svg>
                        </button>
                        <button type="button" @click="removeAsset(a)" class="p-1 rounded hover:bg-red-950/80 text-gray-400 hover:text-red-400 transition" title="删除素材">
                          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7h12l-1 14H7z" stroke-linejoin="round"/><path d="M9 4h6l1 3H8z" stroke-linejoin="round"/></svg>
                        </button>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>

        <!-- 网格视图(对齐 vidonex grid/card:2 列卡片) -->
        <div x-show="assets.length > 0 && filtered.length > 0 && viewMode === 'grid'" class="grid grid-cols-2 gap-2">
          <template x-for="a in filtered" :key="a.id">
            <div class="group bg-gray-950/60 hover:bg-gray-800/60 border border-gray-800/80 hover:border-indigo-500/60 rounded-lg p-1.5 transition-all duration-150 flex flex-col gap-1.5 cursor-grab active:cursor-grabbing relative"
                 :draggable="true" @dragstart="onDragStart($event, a)"
                 :title="a.file_name">
              <div class="w-full aspect-video rounded bg-gray-900 overflow-hidden relative border border-gray-800 flex items-center justify-center">
                <template x-if="a.thumbnail_url && a.file_type !== 'audio'">
                  <img :src="a.thumbnail_url" class="w-full h-full object-cover pointer-events-none">
                </template>
                <template x-if="a.file_type === 'audio' || !a.thumbnail_url">
                  <svg class="w-6 h-6 text-emerald-400" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4a1 1 0 0 0 1 1h3l4 4V5L7 9H4a1 1 0 0 0-1 1z"/></svg>
                </template>
                <span x-show="a.duration_seconds > 0" class="absolute bottom-1 right-1 bg-black/80 text-[10px] font-mono text-gray-300 px-1 rounded pointer-events-none"
                      x-text="Math.floor(a.duration_seconds / 60) + ':' + String(Math.floor(a.duration_seconds % 60)).padStart(2, '0')"></span>
              </div>
              <div class="flex items-center justify-between gap-1 min-w-0">
                <p class="text-[11px] font-medium text-gray-200 truncate flex-1" x-text="a.file_name"></p>
                <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                  <button type="button" @click="openProbeModal(a)" class="p-1 rounded text-gray-400 hover:text-indigo-400 transition" title="素材详情">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M12 12v4" stroke-linecap="round"/></svg>
                  </button>
                  <button type="button" @click="removeAsset(a)" class="p-1 rounded text-gray-400 hover:text-red-400 transition" title="删除素材">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7h12l-1 14H7z" stroke-linejoin="round"/><path d="M9 4h6l1 3H8z" stroke-linejoin="round"/></svg>
                  </button>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>
      <!-- 拖拽提示 -->
      <div class="p-2 border-t border-gray-800 text-[10px] text-gray-600 text-center flex-shrink-0">
        拖拽素材到下方时间轴轨道添加 clip
      </div>
    </div>
  </template>

  <!-- 未打开项目 → 项目列表模式(现有) -->
  <template x-if="!pid">
    <div class="flex flex-col min-h-0 flex-1">
      <div class="flex-1 overflow-y-auto p-2 space-y-1.5">
        {{if .Projects}}
        {{range .Projects}}
        <a href="/project/{{.ID}}"
           class="flex items-center gap-2 p-2 rounded-lg bg-gray-900/60 hover:bg-gray-800 transition max-w-full">
          <div class="w-9 h-7 rounded-md bg-gradient-to-br from-indigo-500 to-violet-600 flex-shrink-0 flex items-center justify-center shadow">
            <svg class="w-3.5 h-3.5 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </div>
          <div class="min-w-0">
            <p class="text-[11px] font-medium text-gray-200 truncate">{{.Name}}</p>
            <p class="text-[10px] text-gray-500 truncate">{{.UpdatedAt.Format "01-02 15:04"}}</p>
          </div>
        </a>
        {{end}}
        {{else}}
        <div class="text-center py-10 text-gray-500">
          <svg class="w-8 h-8 mx-auto mb-2 text-gray-600" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polygon points="14 2 14 8 20 8"/></svg>
          <p class="text-xs">暂无项目</p>
        </div>
        {{end}}
      </div>
      <div class="p-2 border-t border-gray-800 flex-shrink-0">
        <a href="/#new"
           class="flex items-center justify-center gap-1.5 w-full py-1.5 rounded-lg bg-gray-900 border border-gray-800 text-xs text-gray-300 hover:border-indigo-500 transition">
          <svg class="w-3.5 h-3.5 text-indigo-400" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5v14M5 12h14"/></svg>
          新建项目
        </a>
      </div>
    </div>
  </template>

  <!-- ProbeDetailsModal(对齐 vidonex 素材详情:7 字段,媒体库内嵌) -->
  <div x-show="isProbeModalOpen" x-cloak
       class="fixed inset-0 z-[92] flex items-center justify-center p-4"
       style="background:rgba(0,0,0,.6);backdrop-filter:blur(2px)"
       @click.self="closeProbeModal()">
    <div class="w-full max-w-lg rounded-xl bg-gray-950 border border-gray-800 shadow-2xl"
         x-show="activeProbeAsset">
      <!-- Header -->
      <div class="px-4 py-3 border-b border-gray-800 flex items-center justify-between">
        <h3 class="text-sm font-semibold text-gray-200 flex items-center gap-2">
          <svg class="w-4 h-4 text-indigo-400" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          素材详情
        </h3>
        <button type="button" class="p-1 text-gray-500 hover:text-gray-300 transition" @click="closeProbeModal()">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/></svg>
        </button>
      </div>
      <!-- Body:7 字段(对齐上游:file_name/duration/width×height/frame_rate/sample_rate/channels/file_size) -->
      <div class="p-4 text-xs">
        <template x-if="activeProbeAsset">
          <div class="p-3 bg-gray-900/60 rounded-lg border border-gray-800 space-y-2 font-mono">
          <div class="flex justify-between py-1 border-b border-gray-800">
            <span class="text-gray-500">文件</span>
            <span class="text-gray-200 truncate max-w-[240px]" x-text="activeProbeAsset.file_name"></span>
          </div>
          <div class="flex justify-between py-1 border-b border-gray-800">
            <span class="text-gray-500">时长</span>
            <span class="text-indigo-400 font-semibold" x-text="activeProbeAsset.duration_seconds ? activeProbeAsset.duration_seconds.toFixed(2) + 's' : '—'"></span>
          </div>
          <template x-if="activeProbeAsset.width && activeProbeAsset.height">
            <div class="flex justify-between py-1 border-b border-gray-800">
              <span class="text-gray-500">分辨率</span>
              <span class="text-gray-200" x-text="activeProbeAsset.width + ' × ' + activeProbeAsset.height"></span>
            </div>
          </template>
          <template x-if="activeProbeAsset.frame_rate">
            <div class="flex justify-between py-1 border-b border-gray-800">
              <span class="text-gray-500">帧率</span>
              <span class="text-gray-200" x-text="activeProbeAsset.frame_rate + ' FPS'"></span>
            </div>
          </template>
          <template x-if="activeProbeAsset.sample_rate">
            <div class="flex justify-between py-1 border-b border-gray-800">
              <span class="text-gray-500">采样率</span>
              <span class="text-gray-200" x-text="activeProbeAsset.sample_rate + ' Hz'"></span>
            </div>
          </template>
          <template x-if="activeProbeAsset.channels">
            <div class="flex justify-between py-1 border-b border-gray-800">
              <span class="text-gray-500">声道</span>
              <span class="text-gray-200" x-text="activeProbeAsset.channels + ' Channels'"></span>
            </div>
          </template>
          <div class="flex justify-between py-1">
            <span class="text-gray-500">大小</span>
            <span class="text-gray-200" x-text="activeProbeAsset.file_size ? (activeProbeAsset.file_size / (1024 * 1024)).toFixed(2) + ' MB' : '—'"></span>
          </div>
          <div class="mt-3 flex justify-end">
            <button type="button" class="px-3 py-1.5 rounded-lg text-xs text-gray-300 bg-gray-900 border border-gray-800 hover:border-indigo-500 transition" @click="closeProbeModal()">关闭</button>
          </div>
        </div>
        </template>
      </div>
    </div>
  </div>
</div>
