{{/* 媒体库面板(对齐 vidonex PanelsMediaLibrary):
    双模式 —— 未打开项目 = 项目列表;已打开 = 项目素材库(上传/搜索/拖拽入时间轴)。 */}}
<div class="h-full w-full flex flex-col bg-gray-950 border-r border-gray-800 select-none"
     x-data="mediaLibrary({{if .Project}}{{.Project.ID}}{{else}}null{{end}})">
  <!-- Header:打开项目时 = 项目名 + 素材数;否则 = 标题 -->
  <div class="h-10 border-b border-gray-800 px-3 flex items-center justify-between bg-gray-950/80 flex-shrink-0">
    <template x-if="!pid">
      <span class="text-xs font-semibold text-gray-300">媒体库</span>
    </template>
    <template x-if="pid">
      <span class="text-[11px] font-semibold text-gray-200 truncate">素材库 <span class="text-gray-500 font-normal" x-text="'(' + pid + ')'"></span></span>
    </template>
    <span class="text-[10px] text-gray-500" x-text="pid ? assets.length + ' 素材' : {{len .Projects}} + ' 项目'"></span>
  </div>

  <!-- 打开项目 → 素材库模式 -->
  <template x-if="pid">
    <div class="flex flex-col min-h-0 flex-1">
      <!-- 搜索过滤栏(对齐 vidonex fast search filter) -->
      <div class="p-2 border-b border-gray-800/60 flex items-center gap-1.5 bg-gray-950/20 flex-shrink-0">
        <svg class="w-3.5 h-3.5 text-gray-500 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" stroke-linecap="round"/></svg>
        <input type="text" x-model="query" placeholder="过滤素材…"
               class="w-full bg-gray-900/60 border border-gray-800 rounded px-2 py-1 text-[11px] text-gray-200 placeholder-gray-600 focus:outline-none focus:border-indigo-500">
      </div>
      <!-- 上传按钮 -->
      <div class="p-2 border-b border-gray-800/60 flex-shrink-0">
        <label class="flex items-center justify-center gap-1.5 w-full py-2 rounded-lg border border-dashed border-gray-700 hover:border-indigo-500 text-xs text-gray-300 cursor-pointer transition"
               :class="uploading ? 'opacity-50 pointer-events-none' : ''">
          <svg class="w-4 h-4 text-indigo-400" viewBox="0 0 24 24" fill="currentColor"><path d="M12 16V4m0 0l-4 4m4-4l4 4M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          <span x-text="uploading ? '上传中…' : '上传素材'"></span>
          <input type="file" class="hidden" multiple @change="uploadFiles($event)">
        </label>
      </div>
      <!-- 素材网格 -->
      <div class="flex-1 overflow-y-auto p-2 space-y-1.5 min-h-0">
        <template x-for="a in filtered" :key="a.id">
          <!-- 素材卡片:可拖拽到时间轴 -->
          <div class="flex items-center gap-2 p-2 rounded-lg bg-gray-900/60 hover:bg-gray-800 transition cursor-grab active:cursor-grabbing border border-transparent hover:border-indigo-500/40"
               :draggable="true"
               @dragstart="onDragStart($event, a)"
               :title="a.file_name + ' · ' + (a.duration_seconds ? a.duration_seconds.toFixed(2) + 's' : '') + ' · ' + a.width + '×' + a.height">
            <!-- 缩略图 -->
            <div class="w-12 h-8 rounded-md bg-gray-950 flex-shrink-0 flex items-center justify-center overflow-hidden border border-gray-800">
              <template x-if="a.thumbnail_url && a.file_type !== 'audio'">
                <img :src="a.thumbnail_url" class="w-full h-full object-cover">
              </template>
              <template x-if="a.file_type === 'audio' || !a.thumbnail_url">
                <svg class="w-4 h-4 text-emerald-400" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4a1 1 0 0 0 1 1h3l4 4V5L7 9H4a1 1 0 0 0-1 1z"/></svg>
              </template>
            </div>
            <div class="min-w-0 flex-1">
              <p class="text-[11px] font-medium text-gray-200 truncate" x-text="a.file_name"></p>
              <p class="text-[9px] text-gray-500 font-mono"
                 x-text="(a.file_type) + (a.duration_seconds ? ' · ' + a.duration_seconds.toFixed(2) + 's' : '') + (a.width ? ' · ' + a.width + '×' + a.height : '')"></p>
            </div>
            <!-- 删除 -->
            <button type="button" @click="removeAsset(a)" class="p-1 rounded text-gray-600 hover:text-red-400 transition flex-shrink-0" title="删除素材">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7h12l-1 14H7z" stroke-linejoin="round"/><path d="M9 4h6l1 3H8z" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </template>
        <!-- 空态 -->
        <div x-show="!assets.length" class="text-center py-8 text-gray-500">
          <p class="text-xs mb-1">暂无素材</p>
          <p class="text-[10px]">上传 mp4/mov/mp3/wav/图片,拖到时间轴剪辑</p>
        </div>
        <div x-show="assets.length && !filtered.length" class="text-center py-8 text-gray-500 text-xs">无匹配素材</div>
      </div>
      <!-- 拖拽提示 -->
      <div class="p-2 border-t border-gray-800 text-[9px] text-gray-600 text-center flex-shrink-0">
        拖拽素材到下方时间轴轨道添加 clip
      </div>
    </div>
  </template>

  <!-- 未打开项目 → 项目列表模式(现有) -->
  <template x-if="!pid">
    <div class="flex flex-col min-h-0 flex-1">
      <div class="flex-1 overflow-y-auto p-2 space-y-1.5">
        {{if .Projects}}
        {{range .Projects}}
        <a href="/project/{{.ID}}"
           class="flex items-center gap-2 p-2 rounded-lg bg-gray-900/60 hover:bg-gray-800 transition max-w-full"
           hx-get="/project/{{.ID}}" hx-select="#main" hx-target="#main" hx-swap="innerHTML" hx-push-url="true">
          <div class="w-9 h-7 rounded-md bg-gradient-to-br from-indigo-500 to-violet-600 flex-shrink-0 flex items-center justify-center shadow">
            <svg class="w-3.5 h-3.5 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </div>
          <div class="min-w-0">
            <p class="text-[11px] font-medium text-gray-200 truncate">{{.Name}}</p>
            <p class="text-[9px] text-gray-500 truncate">{{.UpdatedAt.Format "01-02 15:04"}}</p>
          </div>
        </a>
        {{end}}
        {{else}}
        <div class="text-center py-10 text-gray-500">
          <svg class="w-8 h-8 mx-auto mb-2 text-gray-600" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polygon points="14 2 14 8 20 8"/></svg>
          <p class="text-xs">暂无项目</p>
        </div>
        {{end}}
      </div>
      <div class="p-2 border-t border-gray-800 flex-shrink-0">
        <a href="/#new"
           class="flex items-center justify-center gap-1.5 w-full py-1.5 rounded-lg bg-gray-900 border border-gray-800 text-xs text-gray-300 hover:border-indigo-500 transition"
           hx-get="/" hx-select="#main" hx-target="#main" hx-swap="innerHTML" hx-push-url="true">
          <svg class="w-3.5 h-3.5 text-indigo-400" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5v14M5 12h14"/></svg>
          新建项目
        </a>
      </div>
    </div>
  </template>
</div>
