{{/* Projects视口页（对齐 vidonex 深色语言：视口区 = Projects选择 + 新建） */}}
<div class="h-full flex flex-col">
  <!-- 视口顶栏（对齐 CanvasViewport 顶部工具区） -->
  <div class="h-10 border-b border-gray-800 px-3 bg-gray-950/80 flex items-center justify-between flex-shrink-0">
    <span class="text-xs font-semibold text-gray-300">Projects</span>
    <div class="flex items-center gap-2">
      <a href="/api/projects" target="_blank" class="text-[11px] text-gray-400 hover:text-indigo-400 transition" title="Open JSON API docs">API API</a>
      <span class="text-[11px] text-gray-600">{{len .Projects}} 个</span>
    </div>
  </div>

  <div class="flex-1 overflow-y-auto p-4">
    {{if not .Projects}}
    <!-- 空态（对齐 vidonex 风格：灰底 + 图标 + 引导） -->
    <div class="text-center py-16 text-gray-500">
      <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gray-900 border border-gray-800 flex items-center justify-center">
        <svg class="w-8 h-8 text-gray-600" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polygon points="14 2 14 8 20 8"/></svg>
      </div>
      <p class="text-sm font-medium text-gray-300">No projects yet</p>
      <p class="text-xs mt-1 text-gray-500">Create your first video project below</p>
    </div>
    {{else}}
    <!-- Projects网格（对齐 vidonex 媒体网格视觉） -->
    <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
      {{range .Projects}}
      <div class="group rounded-xl overflow-hidden bg-gray-900/60 border border-gray-800 hover:border-indigo-500/50 transition-all duration-200">
        <a href="/project/{{.ID}}" class="block">
          <div class="aspect-video bg-gradient-to-br from-gray-800 to-gray-900 relative flex items-center justify-center">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
              <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </div>
            <button class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
              <span class="flex items-center gap-1.5 px-4 py-1.5 rounded-full bg-indigo-500 text-white text-xs font-medium shadow-lg">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 8v4l2 2"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                Open
              </span>
            </button>
          </div>
          <div class="p-3">
            <h3 class="text-sm font-semibold text-gray-200 truncate">{{.Name}}</h3>
            <div class="flex items-center justify-between mt-1.5">
              <span class="text-[11px] text-gray-500">#{{.ID}} · {{.UpdatedAt.Format "01-02 15:04"}}</span>
            </div>
          </div>
        </a>
        <div class="px-3 pb-3 -mt-1">
          <button hx-delete="/project/{{.ID}}" hx-confirm="DeleteProjects {{.ID}}？" hx-target="#main" hx-swap="innerHTML" hx-push-url="/"
                  class="text-[11px] text-gray-600 hover:text-red-400 transition flex items-center gap-1">
            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="currentColor"><path d="M6 7h12l-1 14H7zM9 4h6l1 3H8z"/></svg>
            Delete
          </button>
        </div>
      </div>
      {{end}}
    </div>
    {{end}}

    <!-- 新建Projects(弹窗触发按钮,对齐 vidonex NewProjectModal) -->
    <div class="mt-6">
      <button type="button" @click="window.dispatchEvent(new CustomEvent('new-project-open'))"
              class="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-indigo-500 hover:bg-indigo-400 text-white text-xs font-medium transition shadow-lg shadow-indigo-500/20">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5v14M5 12h14"/></svg>
        新建Projects
      </button>
    </div>

    <!-- 新建Projects弹窗(对齐 vidonex NewProjectModal:预设网格 + fps) -->
    <div x-data="newProjectModalComponent()" x-show="open" x-cloak
         class="fixed inset-0 z-[90] flex items-center justify-center p-4"
         style="background:rgba(0,0,0,.6);backdrop-filter:blur(2px)"
         @click.self="open = false">
      <div class="w-full max-w-lg rounded-xl bg-gray-950 border border-gray-800 shadow-2xl p-5 text-gray-200">
        <h3 class="text-sm font-semibold flex items-center gap-2 mb-4">
          <svg class="w-4 h-4 text-indigo-400" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5v14M5 12h14"/></svg>
          新建Projects
        </h3>
        <!-- Projects名 -->
        <div class="mb-4">
          <label class="block text-[11px] text-gray-500 mb-1">Project Name</label>
          <input type="text" x-model="name" class="w-full bg-gray-900 border border-gray-800 rounded px-2.5 py-1.5 text-xs text-gray-200 focus:outline-none focus:border-indigo-500">
        </div>
        <!-- Canvas Preset网格(对齐 vidonex aspect ratio presets) -->
        <div class="mb-4">
          <label class="block text-[11px] text-gray-500 mb-2">Canvas Preset</label>
          <div class="grid grid-cols-2 gap-2">
            <template x-for="p in presets" :key="p.id">
              <button type="button" @click="applyPreset(p)"
                      class="flex items-center gap-2 p-2 rounded-lg border text-left transition"
                      :class="presetId === p.id ? 'border-indigo-500 bg-indigo-500/10 text-indigo-200' : 'border-gray-800 hover:border-gray-700 bg-gray-900/50 text-gray-400 hover:text-gray-300'">
                <svg class="w-4 h-4 flex-shrink-0 text-indigo-400" viewBox="0 0 24 24" fill="currentColor"><path :d="p.icon"/></svg>
                <span class="min-w-0">
                  <span class="block text-[11px] text-gray-200 truncate" x-text="p.name"></span>
                  <span class="block text-[10px] text-gray-500 font-mono" x-text="p.width + '×' + p.height"></span>
                </span>
              </button>
            </template>
          </div>
        </div>
        <!-- 宽高自定义(对齐 vidonex:预设点击后仍可手动编辑 Width/Height) -->
        <div class="mb-4 grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] text-gray-500 mb-1">Width (px)</label>
            <input type="number" min="16" max="7680" step="2" x-model.number="width"
                   class="w-full bg-gray-900 border border-gray-800 rounded px-2.5 py-1.5 text-xs font-mono text-gray-200 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-[11px] text-gray-500 mb-1">Height (px)</label>
            <input type="number" min="16" max="4320" step="2" x-model.number="height"
                   class="w-full bg-gray-900 border border-gray-800 rounded px-2.5 py-1.5 text-xs font-mono text-gray-200 focus:outline-none focus:border-indigo-500">
          </div>
        </div>
        <!-- fps -->
        <div class="mb-4">
          <label class="block text-[11px] text-gray-500 mb-1">Frame Rate</label>
          <div class="flex gap-2">
            <template x-for="f in fpsOptions" :key="f.value">
              <button type="button" @click="fps = f.value"
                      class="flex-1 px-2 py-1.5 rounded-lg border text-[11px] transition"
                      :class="fps === f.value ? 'border-indigo-500 bg-indigo-500/10 text-white' : 'border-gray-800 text-gray-400 hover:border-gray-600'"
                      x-text="f.label"></button>
            </template>
          </div>
        </div>
        <p x-show="error" class="text-[11px] text-red-400 mb-2" x-text="error"></p>
        <div class="flex justify-end gap-2">
          <button type="button" @click="open = false" class="px-3 py-1.5 rounded-lg text-xs text-gray-400 hover:bg-gray-900 transition">Cancel</button>
          <button type="button" @click="create()" :disabled="creating || !name.trim()"
                  class="px-4 py-1.5 rounded-lg text-xs font-medium bg-indigo-500 hover:bg-indigo-400 text-white transition disabled:opacity-50"
                  x-text="creating ? 'Creating...' : 'Create Project'"></button>
        </div>
      </div>
    </div>
  </div>
</div>
