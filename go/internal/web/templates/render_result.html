{{/* 渲染结果（对齐 vidonex 深色反馈卡片：成功/失败双态） */}}
<div id="render-result">
  {{if .Output}}
  <div class="p-3 rounded-lg border border-emerald-500/30 bg-emerald-950/30">
    <div class="flex items-start gap-2">
      <svg class="w-4 h-4 text-emerald-400 flex-shrink-0 mt-0.5" viewBox="0 0 24 24" fill="currentColor"><path d="M5 13l4 4L19 7"/></svg>
      <div class="text-xs text-emerald-200">
        <p class="font-medium">渲染完成</p>
        <p class="mt-1 font-mono text-[10px] break-all text-emerald-300/80">{{.Output}}</p>
        <p class="mt-1 text-[10px] text-emerald-400/70">{{.SizeMB}} MB · {{.Duration}} · 耗时 {{.Elapsed}}</p>
      </div>
    </div>
  </div>
  {{else if .Error}}
  <div class="p-3 rounded-lg border border-red-500/30 bg-red-950/30">
    <div class="flex items-start gap-2">
      <svg class="w-4 h-4 text-red-400 flex-shrink-0 mt-0.5" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 8v5M12 16v.5"/></svg>
      <div class="text-xs text-red-200">
        <p class="font-medium">渲染失败</p>
        <p class="mt-1 font-mono text-[10px] break-all text-red-300/80">{{.Error}}（耗时 {{.Elapsed}}）</p>
      </div>
    </div>
  </div>
  {{end}}
</div>
