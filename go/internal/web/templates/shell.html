<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vidproc 工作室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="icon" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/htmx.min.js"></script>
  <script src="/assets/alpine.min.js" defer></script>
</head>
<body class="h-screen w-screen flex flex-col bg-[#0b0f19] text-gray-100 overflow-hidden font-sans">
  <!-- Top Header（对齐 vidonex AppHeader：h-14 毛玻璃 + 项目名 + 保存状态） -->
  <header class="h-14 border-b border-gray-800 bg-gray-950/90 backdrop-blur px-4 flex items-center justify-between select-none z-30 flex-shrink-0">
    <!-- Left: Branding & Project Title -->
    <div class="flex items-center gap-3 min-w-0">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <span class="font-bold text-base tracking-tight bg-gradient-to-r from-white via-gray-200 to-gray-400 bg-clip-text text-transparent hidden sm:inline">vidproc</span>
      </div>

      <div class="h-5 w-px bg-gray-800 mx-1"></div>

      <!-- Project Switcher & Name（项目详情页有编辑；列表页显示当前入口） -->
      <div class="flex items-center gap-1.5 group" id="project-title-area">
        <a href="/" class="p-1 text-gray-400 hover:text-white transition" title="项目列表">
          <svg class="w-4 h-4 text-indigo-400" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        </a>
        <span id="project-name" class="text-sm font-medium text-gray-200 truncate max-w-[110px] md:max-w-[180px]"></span>
        <span class="text-xs text-gray-500 items-center gap-1 hidden sm:flex">
          <svg class="w-3 h-3 text-emerald-500" viewBox="0 0 24 24" fill="currentColor"><path d="M5 13l4 4L19 7"/></svg>
          已保存
        </span>
      </div>
    </div>

    <!-- Center: Quick Presets（社区预设，对齐 vidonex presetMenu） -->
    <div class="items-center gap-2 hidden md:flex">
      <a href="/" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-gray-900 border border-gray-800 text-xs text-gray-300 hover:border-indigo-500 transition"
         hx-get="/" hx-select="#main" hx-target="#main" hx-swap="innerHTML" hx-push-url="true">
        <svg class="w-3.5 h-3.5 text-indigo-400" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        项目
      </a>
      <a href="/api/projects" target="_blank" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-gray-900 border border-gray-800 text-xs text-gray-300 hover:border-indigo-500 transition">
        <svg class="w-3.5 h-3.5 text-indigo-400" viewBox="0 0 24 24" fill="currentColor"><path d="M4 5h16v2H4zm2 4h12v2H6zm0 4h14v2H6zm0 4h10v2H6z"/></svg>
        API
      </a>
    </div>

    <!-- Right: Studio 状态 -->
    <div class="flex items-center gap-1">
      <span class="text-xs text-gray-500 hidden md:inline" title="无损拼接 · 滤镜图 · UDTA 容器元数据">无损拼接</span>
      <div class="h-4 w-px bg-gray-800 mx-1 hidden md:block"></div>
      <button type="button" onclick="window.vp.openShortcuts()" title="快捷键 (Ctrl+/)"
              class="p-1.5 rounded-md text-gray-400 hover:text-white hover:bg-gray-900 transition">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4m0 4h.01" stroke-linecap="round"/></svg>
      </button>
      <button type="button" onclick="window.vp.openPalette()" title="命令面板 (Ctrl+K)"
              class="p-1.5 rounded-md text-gray-400 hover:text-white hover:bg-gray-900 transition">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <!-- 主布局：垂直可拖拽（上部工作区 + 底部时间轴），对齐 vidonex USplitter -->
  <div id="studio-root" class="flex-1 min-h-0 relative" x-data="studioLayout()" x-init="initLayout()">
    <!-- 上部工作区：水平三栏（媒体库 | 视口 | 检查器），对齐 vidonex horizontal splitter -->
    <div class="absolute inset-0 flex" :style="'bottom:' + timelineH + 'px'">
      <!-- Media Library（对齐 PanelsMediaLibrary） -->
      <aside class="h-full flex flex-col overflow-hidden" :style="'width:' + mediaW + 'px'">
        {{template "media_panel.html" .}}
      </aside>
      <!-- 拖拽把手（水平） -->
      <div class="w-1.5 bg-gray-800/80 hover:bg-indigo-500/60 cursor-col-resize z-20 flex items-center justify-center" @mousedown="dragCol('media')" @dblclick="resetPane('media')" title="双击复位">
        <div class="h-8 w-0.5 rounded-full bg-gray-600/70 group-hover:bg-indigo-200"></div>
      </div>
      <!-- Viewport Preview（对齐 ViewportCanvasViewport） -->
      <main class="h-full flex flex-col overflow-hidden flex-1">
        <div id="main" class="flex-1 min-h-0 overflow-y-auto">
          {{.Content}}
        </div>
      </main>
      <!-- 拖拽把手（水平） -->
      <div class="w-1.5 bg-gray-800/80 hover:bg-indigo-500/60 cursor-col-resize z-20 flex items-center justify-center" @mousedown="dragCol('inspector')" @dblclick="resetPane('inspector')" title="双击复位">
        <div class="h-8 w-0.5 rounded-full bg-gray-600/70 group-hover:bg-indigo-200"></div>
      </div>
      <!-- Inspector（对齐 PanelsInspectorPanel） -->
      <aside class="h-full flex flex-col overflow-hidden" :style="'width:' + inspectorW + 'px'">
        {{template "inspector_panel.html" .}}
      </aside>
    </div>

    <!-- 底部时间轴：对齐 vidonex TimelineContainer -->
    <div class="absolute inset-x-0 bottom-0 border-t border-gray-800 bg-gray-950 flex flex-col" :style="'height:' + timelineH + 'px'">
      {{template "timeline_panel.html" .}}
    </div>

    <!-- 垂直拖拽把手（时间轴高度） -->
    <div class="absolute bottom-0 inset-x-0 h-1.5 bg-gray-800/80 hover:bg-indigo-500/60 cursor-row-resize z-30" :style="'bottom:' + (timelineH - 6) + 'px'" @mousedown="dragRow()" @dblclick="resetPane('timeline')" title="双击复位">
      <div class="w-8 h-0.5 rounded-full bg-gray-600/70 mx-auto mt-0.5"></div>
    </div>
  </div>

  <!-- 底部状态栏(对齐上游 LayoutAppFooter / AppFooter.vue):
       h-9,左=时间码(indigo)+ / + 内容时长 + FPS,右=吸附开关 + 缩放滑条(min15 max200 step5) + px/s 读数。
       数据来自 window.vp(appFooter 组件监听 playhead-changed / timeline-loaded 刷新)。 -->
  <footer class="h-9 border-t border-gray-800 bg-gray-950 px-4 flex items-center justify-between text-xs text-gray-400 select-none z-30 flex-shrink-0"
          x-data="appFooter()">
    <!-- 左:时间码与时长 -->
    <div class="flex items-center gap-4 font-mono">
      <div class="flex items-center gap-1.5 text-gray-200">
        <span class="text-indigo-400 font-semibold" x-text="timecode"></span>
        <span class="text-gray-600">/</span>
        <span class="text-gray-400" x-text="duration"></span>
      </div>

      <div class="h-3.5 w-px bg-gray-800"></div>

      <div class="items-center gap-1 text-gray-400 hidden sm:flex">
        <span class="text-gray-500">FPS:</span>
        <span class="text-gray-300" x-text="fps"></span>
      </div>
    </div>

    <!-- 右:吸附开关与缩放 -->
    <div class="flex items-center gap-4">
      <!-- 磁吸开关 -->
      <button type="button" @click="toggleSnap()"
              class="flex items-center gap-1.5 px-2 py-0.5 rounded text-xs transition"
              :class="snapOn ? 'bg-indigo-500/20 text-indigo-400 border border-indigo-500/30' : 'text-gray-500 hover:text-gray-300'">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>
        <span x-text="snapOn ? '磁吸开' : '磁吸关'" class="hidden sm:inline"></span>
      </button>

      <div class="h-3.5 w-px bg-gray-800"></div>

      <!-- 缩放滑条(窄屏隐藏,保留磁吸) -->
      <div class="items-center gap-2 hidden md:flex">
        <button type="button" class="hover:text-gray-200 transition" title="缩小" @click="zoomOut()">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14" stroke-linecap="round"/></svg>
        </button>

        <input type="range" min="15" max="200" step="5" :value="pps"
               class="w-24 h-1 bg-gray-800 rounded-lg appearance-none cursor-pointer accent-indigo-500"
               @input="setZoom($event.target.value)">

        <button type="button" class="hover:text-gray-200 transition" title="放大" @click="zoomIn()">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
        </button>

        <span class="font-mono text-gray-500 w-10 text-right" x-text="pps + 'px/s'"></span>
      </div>
    </div>
  </footer>

  <!-- 全站模态:命令面板(Ctrl+K)/ 快捷键表(Ctrl+/)/ 关于(对齐 vidonex CommandPalette + KeyboardShortcutsModal + AboutModal) -->
  <div x-data="appModals()" class="contents">
    <!-- 命令面板(对齐 vidonex UCommandPalette:分组 + 键盘导航 ↑↓ Enter + 图标) -->
    <div x-show="view === 'palette'" x-cloak
         class="fixed inset-0 z-[98] flex items-start justify-center pt-[12vh] p-4"
         style="background:rgba(0,0,0,.6);backdrop-filter:blur(2px)"
         @click.self="view = null">
      <div class="w-full max-w-md sm:max-w-xl rounded-xl bg-gray-950 border border-gray-800 shadow-2xl overflow-hidden max-h-[85vh]">
        <!-- 搜索框 -->
        <div class="flex items-center gap-2 px-3 py-2.5 border-b border-gray-800">
          <svg class="w-4 h-4 text-gray-500 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" stroke-linecap="round"/></svg>
          <input type="text" x-model="query" placeholder="输入命令…(分割 / 添加轨道 / 比例)" autofocus
                 class="w-full bg-transparent text-sm text-gray-200 placeholder-gray-600 focus:outline-none">
          <span class="text-[10px] text-gray-600 border border-gray-800 rounded px-1.5 py-0.5">Esc</span>
        </div>
        <!-- 分组命令列表 -->
        <div class="max-h-72 overflow-y-auto py-1">
          <template x-for="(g, gi) in filteredGroups" :key="'g' + g.id">
            <div>
              <!-- 组标题 -->
              <div class="px-3 pt-2 pb-1 text-[10px] font-semibold uppercase tracking-wider text-gray-600" x-text="g.label"></div>
              <template x-for="c in g.items" :key="c.id">
                <button type="button" data-pal-item @click="run(c)"
                        class="w-full px-3 py-2 flex items-center justify-between transition text-left"
                        :class="palIdx === flatCmdIndex(c.id) ? 'bg-indigo-500/15' : 'hover:bg-gray-900'">
                  <span class="flex items-center gap-2.5 min-w-0">
                    <svg class="w-3.5 h-3.5 flex-shrink-0" :class="palIdx === flatCmdIndex(c.id) ? 'text-indigo-300' : 'text-gray-500'"
                         viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <path :d="c.icon"></path>
                    </svg>
                    <span class="min-w-0">
                      <span class="block text-xs font-medium text-gray-200 truncate" x-text="c.name"></span>
                      <span class="block text-[10px] text-gray-500 truncate" x-text="c.desc"></span>
                    </span>
                  </span>
                  <span x-show="c.keys" class="text-[10px] font-mono text-gray-600 flex-shrink-0 ml-2" x-text="c.keys"></span>
                </button>
              </template>
            </div>
          </template>
          <div x-show="!filteredGroups.length" class="px-3 py-4 text-center text-xs text-gray-600">无匹配命令</div>
        </div>
        <!-- 底部导航提示 -->
        <div class="px-3 py-1.5 border-t border-gray-800 flex items-center gap-3 text-[9px] text-gray-600">
          <span class="flex items-center gap-1"><kbd class="px-1 rounded border border-gray-800 bg-gray-900">↑</kbd><kbd class="px-1 rounded border border-gray-800 bg-gray-900">↓</kbd> 导航</span>
          <span class="flex items-center gap-1"><kbd class="px-1 rounded border border-gray-800 bg-gray-900">Enter</kbd> 执行</span>
        </div>
      </div>
    </div>

    <!-- 快捷键表(对齐 vidonex KeyboardShortcutsModal:搜索 + 分类) -->
    <div x-show="view === 'shortcuts'" x-cloak
         class="fixed inset-0 z-[98] flex items-center justify-center p-4"
         style="background:rgba(0,0,0,.6);backdrop-filter:blur(2px)"
         @click.self="view = null">
      <div class="w-full max-w-md sm:max-w-xl rounded-xl bg-gray-950 border border-gray-800 shadow-2xl p-5 max-h-[85vh] overflow-y-auto">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-semibold text-gray-200 flex items-center gap-2">
            <svg class="w-4 h-4 text-indigo-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4m0 4h.01" stroke-linecap="round"/></svg>
            键盘快捷键
          </h3>
          <button type="button" class="p-1 text-gray-500 hover:text-gray-300 transition" @click="view = null">✕</button>
        </div>
        <!-- 搜索 -->
        <div class="flex items-center gap-2 px-2.5 py-1.5 mb-3 rounded-lg bg-gray-900/60 border border-gray-800">
          <svg class="w-3.5 h-3.5 text-gray-500 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" stroke-linecap="round"/></svg>
          <input type="text" x-model="shortcutQuery" placeholder="搜索快捷键…(如 分割 / Ctrl+Z)"
                 class="w-full bg-transparent text-[11px] text-gray-200 placeholder-gray-600 focus:outline-none">
        </div>
        <div class="max-h-80 overflow-y-auto space-y-2.5">
          <template x-for="g in shortcutGroups()" :key="g.label">
            <div>
              <div class="px-1 pb-1 text-[10px] font-semibold uppercase tracking-wider text-gray-600" x-text="g.label"></div>
              <div class="grid gap-1">
                <template x-for="s in g.items" :key="s.keys + s.desc">
                  <div class="flex items-center justify-between px-2 py-1.5 rounded-lg hover:bg-gray-900/60">
                    <span class="text-[11px] text-gray-400" x-text="s.desc"></span>
                    <kbd class="text-[10px] font-mono px-1.5 py-0.5 rounded border border-gray-800 bg-gray-900 text-indigo-300" x-text="s.keys"></kbd>
                  </div>
                </template>
              </div>
            </div>
          </template>
          <div x-show="!filteredShortcuts.length" class="text-center text-xs text-gray-600 py-4">无匹配快捷键</div>
        </div>
        <div class="mt-3 pt-3 border-t border-gray-800 text-[10px] text-gray-600 text-center">
          按 Ctrl+/ 或 Esc 关闭
        </div>
      </div>
    </div>

    <!-- 关于(对齐 vidonex AboutModal:系统诊断 OS/Arch/Cores/GPU/FFmpeg + 链接) -->
    <div x-show="view === 'about'" x-cloak
         class="fixed inset-0 z-[98] flex items-center justify-center p-4"
         style="background:rgba(0,0,0,.6);backdrop-filter:blur(2px)"
         @click.self="view = null">
      <div class="w-full max-w-sm sm:max-w-lg rounded-xl bg-gray-950 border border-gray-800 shadow-2xl p-6 text-center max-h-[85vh] overflow-y-auto">
        <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <svg class="w-7 h-7 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <h3 class="text-base font-bold text-gray-100">vidproc 工作室</h3>
        <p class="text-[11px] text-gray-500 mt-0.5" x-text="'v' + version"></p>
        <p class="text-xs text-gray-400 mt-3" x-text="architecture"></p>
        <p class="text-[10px] text-gray-600 mt-2">vidonex 兼容 project.yaml · htmx + Alpine 事件总线</p>
        <!-- 系统诊断(对齐 vidonex AboutModal diagnostics) -->
        <div class="mt-4 rounded-lg border border-gray-800 bg-gray-900/50 p-3 text-left space-y-1.5">
          <div class="flex items-center justify-between text-[11px]">
            <span class="text-gray-500">操作系统</span>
            <span class="font-mono text-gray-300 truncate ml-3" x-text="sys.os"></span>
          </div>
          <div class="flex items-center justify-between text-[11px]">
            <span class="text-gray-500">架构</span>
            <span class="font-mono text-gray-300" x-text="sys.arch"></span>
          </div>
          <div class="flex items-center justify-between text-[11px]">
            <span class="text-gray-500">CPU 核心</span>
            <span class="font-mono text-gray-300" x-text="sys.cores + (sys.cores !== '—' ? ' 逻辑核' : '')"></span>
          </div>
          <div class="flex items-center justify-between text-[11px]">
            <span class="text-gray-500" title="显卡(WebGL 渲染器)">显卡</span>
            <span class="font-mono text-gray-300 truncate ml-3 max-w-[180px]" x-text="sys.gpu || '未知'"></span>
          </div>
          <div class="flex items-center justify-between text-[11px]">
            <span class="text-gray-500" title="视频编码工具版本">FFmpeg</span>
            <span class="font-mono text-gray-300" x-text="sys.ffmpeg"></span>
          </div>
        </div>
        <div class="mt-4 flex items-center justify-center gap-2">
          <button type="button" class="px-3 py-1.5 rounded-lg bg-gray-900 border border-gray-800 text-xs text-gray-300 hover:border-indigo-500 transition" @click="view = null">关闭</button>
        </div>
      </div>
    </div>
  </div>

  <!-- vidproc 业务逻辑(timelineEditor/projectView/播放头总线)在布局脚本之前,
        Alpine defer 初始化时组件已定义 -->
  <script src="/assets/nav.js"></script>
  <script>
    // 可拖拽分栏布局（对齐 vidonex USplitter 行为；状态存 localStorage）
    function studioLayout() {
      return {
        mediaW: 280,
        inspectorW: 300,
        timelineH: 240,
        min: { media: 180, inspector: 220, timeline: 120 },
        max: { media: 0.4, inspector: 0.4, timeline: 0.7 }, // 视口比例上限(响应式钳制)
        clampAll() {
          const vw = window.innerWidth, vh = window.innerHeight;
          this.mediaW = Math.min(Math.max(this.mediaW, this.min.media), vw * this.max.media);
          this.inspectorW = Math.min(Math.max(this.inspectorW, this.min.inspector), vw * this.max.inspector);
          this.timelineH = Math.min(Math.max(this.timelineH, this.min.timeline), vh * this.max.timeline);
        },
        save() {
          localStorage.setItem('vidproc-layout', JSON.stringify({ mediaW: this.mediaW, inspectorW: this.inspectorW, timelineH: this.timelineH }));
        },
        initLayout() {
          const skin = JSON.parse(localStorage.getItem('vidproc-layout') || 'null');
          if (skin) { this.mediaW = skin.mediaW; this.inspectorW = skin.inspectorW; this.timelineH = skin.timelineH; }
          this.clampAll(); // 窗口缩小后布局不溢出视口
          window.addEventListener('resize', this.clampAll.bind(this));
          const name = document.getElementById('project-name');
          if (name && document.title && !name.textContent) {
            name.textContent = document.title.replace('vidproc', '').trim() || 'video project';
          }
        },
        resetPane(side) { // 双击把手复位默认宽度/高度
          if (side === 'media') this.mediaW = 280;
          else if (side === 'inspector') this.inspectorW = 300;
          else if (side === 'timeline') this.timelineH = 240;
          this.clampAll();
          this.save();
        },
        dragCol(side) {
          const target = this;
          const root = document.getElementById('studio-root');
          const onMove = (e) => {
            if (!root) return;
            const rect = root.getBoundingClientRect();
            if (side === 'media') {
              target.mediaW = Math.min(Math.max(this.min.media, e.clientX - rect.left), rect.width * this.max.media);
            } else {
              target.inspectorW = Math.min(Math.max(this.min.inspector, rect.right - e.clientX), rect.width * this.max.inspector);
            }
          };
          const onUp = () => {
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
            target.save();
          };
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        },
        dragRow() {
          const target = this;
          const root = document.getElementById('studio-root');
          const onMove = (e) => {
            if (!root) return;
            const rect = root.getBoundingClientRect();
            target.timelineH = Math.min(Math.max(this.min.timeline, rect.bottom - e.clientY), rect.height * this.max.timeline);
          };
          const onUp = () => {
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
            target.save();
          };
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        }
      }
    }
  </script>
</body>
</html>
