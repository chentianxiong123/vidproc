{{/* 时间轴面板（对齐 vidonex TimelineContainer：工具栏 + 标尺 + 轨道行） */}}
<div class="h-full flex flex-col bg-gray-950 select-none overflow-hidden" dir="ltr">
  <!-- Timeline Actions Toolbar（对齐 vidonex：h-10 + 按钮组 + 吸附开关） -->
  <div class="h-10 border-b border-gray-800 px-3 bg-gray-950/80 flex items-center justify-between z-20 flex-shrink-0">
    <div class="flex items-center gap-1.5">
      <button type="button" class="px-2.5 py-1 rounded-md bg-gray-900 border border-gray-700 text-xs text-gray-200 hover:border-indigo-500 transition flex items-center gap-1">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5v14M5 12h14"/></svg>
        <span>轨道</span>
      </button>
      <div class="h-4 w-px bg-gray-800 mx-1"></div>
      <button type="button" class="p-1.5 rounded-md text-gray-400 hover:text-white hover:bg-gray-900 transition" title="撤消 (Ctrl+Z)">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10a6 6 0 0 1 0 12h-3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="p-1.5 rounded-md text-gray-400 hover:text-white hover:bg-gray-900 transition" title="重做 (Ctrl+Y)">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14l5-5-5-5" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 9H10a6 6 0 0 0 0 12h3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="h-4 w-px bg-gray-800 mx-1"></div>
      <button type="button" class="px-2 py-1 rounded-md text-gray-400 hover:text-white hover:bg-gray-900 transition text-[11px]" title="在播放头处分割 (S)" disabled>
        <svg class="w-3.5 h-3.5 inline" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4v16l8-8zM14 12l4-8v16z"/></svg>
      </button>
      <button type="button" class="px-2 py-1 rounded-md text-gray-400 hover:text-white hover:bg-gray-900 transition text-[11px] hidden sm:inline" title="裁剪 (C)" disabled>裁剪</button>
      <button type="button" class="p-1.5 rounded-md text-gray-400 hover:text-red-400 transition" title="删除选中 (Del)" disabled>
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7h12l-1 14H7z" stroke-linejoin="round"/><path d="M9 4h6l1 3H8z" stroke-linejoin="round"/></svg>
      </button>
      <div class="h-4 w-px bg-gray-800 mx-1"></div>
      <!-- Snapping Toggle，对齐 vidonex Snap ON/OFF -->
      <button type="button" x-data="{on:true}" @click="on=!on"
              class="px-2 py-1 rounded-md transition text-[10px] font-mono font-semibold"
              :class="on ? 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/40' : 'text-gray-500 border border-gray-800 hover:border-gray-600'"
              title="磁吸吸附 (N)">
        <svg class="w-3 h-3 inline mr-0.5" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h7l-1 8 10-12h-7z"/></svg>
        <span x-text="on ? 'Snap ON' : 'Snap OFF'"></span>
      </button>
    </div>
    <div class="flex items-center gap-1">
      <button type="button" class="p-1.5 rounded-md text-gray-400 hover:text-white hover:bg-gray-900 transition" title="快捷键 (?)">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.8 2.1c-.8.5-1.3 1-1.3 1.9" stroke-linecap="round"/><path d="M12 17h.01" stroke-linecap="round"/></svg>
      </button>
      <div class="h-4 w-px bg-gray-800 mx-1"></div>
      <!-- Zoom 控件（对齐 vidonex zoom range） -->
      <div class="flex items-center gap-1">
        <button type="button" class="p-1 text-gray-400 hover:text-white transition" title="缩小">
          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14" stroke-linecap="round"/></svg>
        </button>
        <input type="range" min="0.25" max="4" step="0.05" value="1"
               class="w-24 accent-indigo-500" x-data x-init="$el.addEventListener('input', e => window.dispatchEvent(new CustomEvent('timeline-zoom', {detail: +e.target.value})))">
        <button type="button" class="p-1 text-gray-400 hover:text-white transition" title="放大">
          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="flex-1 min-h-0 overflow-auto">
    <div class="min-w-full inline-block">
      <!-- Ruler（对齐 TimelineRuler：标尺 + 播放头） -->
      <div class="h-6 border-b border-gray-800 bg-gray-950/60 relative text-[9px] font-mono text-gray-500" x-data="{zoom:1}" @timeline-zoom.window="zoom=$event.detail">
        <div class="absolute inset-y-0 left-12 right-0 flex items-end">
          <template x-for="i in 24" :key="i">
            <div class="flex-1 flex items-end border-l border-gray-800/60 pl-0.5 text-[8px] leading-4" x-text="(i-1)*5"></div>
          </template>
        </div>
        <!-- Playhead -->
        <div class="absolute top-0 bottom-0 border-l-2 border-indigo-500 z-20" :style="'left:' + (50 + 120 * zoom) + 'px'">
          <div class="w-0 h-0 border-l-[5px] border-r-[5px] border-b-[6px] border-l-transparent border-r-transparent border-b-indigo-500 -ml-[5px]"></div>
        </div>
      </div>
      <!-- Track List（对齐 vidonex TrackHeader + TrackRow） -->
      <div class="flex">
        <!-- 轨道头列（对齐 TrackHeader） -->
        <div class="w-12 flex-shrink-0 border-r border-gray-800 bg-gray-950/60">
          <div class="h-12 border-b border-gray-800/80 flex items-center justify-center text-gray-500">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </div>
          <div class="h-12 border-b border-gray-800/80 flex items-center justify-center text-gray-500">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4a1 1 0 0 0 1 1h3l4 4V5L7 9H4a1 1 0 0 0-1 1z"/></svg>
          </div>
        </div>
        <!-- 轨道区 -->
        <div class="flex-1">
          <!-- Video Track -->
          <div class="h-12 border-b border-gray-800/80 bg-gray-950/40 relative flex items-center justify-center text-gray-600 text-[10px]">
            {{if .Project}}<span class="text-gray-600 text-[10px] font-mono">track v1 — 从视口"渲染"后此处显示 clip</span>{{else}}<span class="text-gray-600 text-[10px]">打开项目查看轨道</span>{{end}}
          </div>
          <!-- Audio Track -->
          <div class="h-12 border-b border-gray-800/80 bg-gray-950/40 relative flex items-center justify-center text-gray-600 text-[10px]">
            <span class="text-gray-600 text-[10px] opacity-50">audio track a1</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
