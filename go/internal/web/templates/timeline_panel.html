{{/* 时间轴面板（对齐 vidonex TimelineContainer：工具栏 + 标尺 + 真实 clip 轨道行） */}}
{{/* 数据源：/api/projects/{id}/timeline —— 解析项目 spec 的数值化时间轴 */}}
<div class="h-full flex flex-col bg-gray-950 select-none overflow-hidden" dir="ltr"
     x-data="timelineEditor({{if .Project}}{{.Project.ID}}{{else}}null{{end}})">
  <!-- Timeline Actions Toolbar（对齐 vidonex：h-10 + 按钮组 + Snap 开关） -->
  <div class="h-10 border-b border-gray-800 px-3 bg-gray-950/80 flex items-center justify-between z-20 flex-shrink-0">
    <div class="flex items-center gap-1.5">
      <!-- 轨道菜单(对齐 vidonex addTrack:video/overlay/audio/waveform/subtitle) -->
      <div class="relative" x-data="{ trackMenu: false }" @click.away="trackMenu = false">
        <button type="button" @click="trackMenu = !trackMenu"
                class="px-2.5 py-1 rounded-md bg-gray-900 border border-gray-700 text-xs text-gray-200 hover:border-indigo-500 transition flex items-center gap-1">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5v14M5 12h14"/></svg>
          <span>轨道</span>
          <svg class="w-2.5 h-2.5 text-gray-500" viewBox="0 0 24 24" fill="currentColor"><path d="M6 9l6 6 6-6z"/></svg>
        </button>
        <div x-show="trackMenu" x-cloak class="absolute top-8 left-0 z-40 w-44 rounded-lg bg-gray-900 border border-gray-800 shadow-2xl py-1">
          <template x-for="k in ['video', 'audio', 'overlay', 'subtitle', 'waveform']" :key="k">
            <button type="button" class="w-full px-3 py-1.5 text-left text-[11px] text-gray-300 hover:bg-gray-800 transition flex items-center justify-between"
                    @click="addTrack(k); trackMenu = false">
              <span x-text="'添加 ' + ({video:'视频', audio:'音频', overlay:'叠加', subtitle:'字幕', waveform:'波形'})[k] + ' 轨道'"></span>
              <svg class="w-3 h-3 text-gray-600" viewBox="0 0 24 24" fill="currentColor" x-show="k === 'video'"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </template>
          <div class="border-t border-gray-800 my-1"></div>
          <button type="button" class="w-full px-3 py-1.5 text-left text-[11px] text-gray-300 hover:bg-gray-800 transition flex items-center gap-1.5"
                  :class="selectedId ? '' : 'opacity-40 cursor-not-allowed'" @click="duplicateClip(); trackMenu = false">
            <svg class="w-3 h-3 text-indigo-400" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/></svg>
            复制选中 clip
          </button>
        </div>
      </div>
      <div class="h-4 w-px bg-gray-800 mx-1"></div>
      <button type="button" class="p-1.5 rounded-md text-gray-400 hover:text-white hover:bg-gray-900 transition" title="撤消 (Ctrl+Z)" :class="canUndo() ? '' : 'opacity-40 pointer-events-none'" @click="undo()">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10a6 6 0 0 1 0 12h-3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="p-1.5 rounded-md text-gray-400 hover:text-white hover:bg-gray-900 transition" title="重做 (Ctrl+Shift+Z)" :class="canRedo() ? '' : 'opacity-40 pointer-events-none'" @click="redo()">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14l5-5-5-5" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 9H10a6 6 0 0 0 0 12h3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="h-4 w-px bg-gray-800 mx-1"></div>
      <button type="button" class="px-2 py-1 rounded-md text-xs text-gray-300 hover:text-white hover:bg-gray-900 transition flex items-center gap-1"
              title="在播放头处分割 (S)" :class="selectedId ? '' : 'opacity-40 cursor-not-allowed'" @click="split()">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4v16l8-8zM14 12l4-8v16z"/></svg>
        <span class="hidden md:inline">分割</span>
      </button>
      <button type="button" class="px-2 py-1 rounded-md text-xs text-gray-300 hover:text-white hover:bg-gray-900 transition flex items-center gap-1"
              title="复制片段 (Ctrl+D)" :class="selectedId ? '' : 'opacity-40 cursor-not-allowed'" @click="duplicateClip()">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z" stroke-linejoin="round"/></svg>
        <span class="hidden md:inline">复制</span>
      </button>
      <!-- 裁剪模式(对齐 vidonex TimelineContainer Crop:广播给视口切 gizmoMode=crop) -->
      <button type="button" class="px-2 py-1 rounded-md text-xs text-gray-300 hover:text-white hover:bg-gray-900 transition flex items-center gap-1"
              title="裁剪模式 (视口裁剪工具)"
              @click="window.dispatchEvent(new CustomEvent('gizmo-mode', { detail: { mode: 'crop' } }))">
        <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 2v15a2 2 0 0 0 2 2h13M2 7h15a2 2 0 0 1 2 2v13" stroke-linecap="round"/></svg>
        <span class="hidden md:inline">裁剪</span>
      </button>
      <button type="button" class="px-2 py-1 rounded-md text-xs text-gray-300 hover:text-white hover:bg-gray-900 transition flex items-center gap-1"
              title="删除选中 (Del)" :class="selectedId ? '' : 'opacity-40 cursor-not-allowed'" @click="deleteSelected()">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7h12l-1 14H7z" stroke-linejoin="round"/><path d="M9 4h6l1 3H8z" stroke-linejoin="round"/></svg>
        <span class="hidden md:inline">删除</span>
      </button>
      <div class="h-4 w-px bg-gray-800 mx-1"></div>
      <!-- Snap 开关（对齐 vidonex Snap ON/OFF，N 键切换） -->
      <button type="button" data-snap="on" @click="toggleSnap()"
              class="px-2 py-1 rounded-md transition text-[10px] font-mono font-semibold snap-on"
              :class="['']" title="磁吸吸附 (N)">
        <svg class="w-3 h-3 inline mr-0.5" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h7l-1 8 10-12h-7z"/></svg>
        <span x-text="snapEnabled() ? '磁吸开' : '磁吸关'"></span>
      </button>
    </div>
    <div class="flex items-center gap-1">
      <!-- 播放头时间（对齐 vidonex 标尺时间戳） -->
      <span class="text-[10px] font-mono text-indigo-300 w-24 text-right" x-text="fmt(playhead)"></span>
      <div class="h-4 w-px bg-gray-800 mx-1"></div>
      <!-- 快捷键帮助(对齐 vidonex ? 按钮 → KeyboardShortcutsModal) -->
      <button type="button" class="p-1.5 rounded-md text-gray-400 hover:text-white hover:bg-gray-900 transition" title="快捷键 (? / Ctrl+/)"
              @click="window.dispatchEvent(new CustomEvent('app-modals-open', { detail: { view: 'shortcuts' } }))">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h4M7 13h2" stroke-linecap="round"/><path d="M15 9v6M13 12h4" stroke-linecap="round"/></svg>
      </button>
      <div class="h-4 w-px bg-gray-800 mx-1"></div>
      <!-- Zoom 控件(对齐参考:缩小/放大按钮,无滑条) -->
      <div class="flex items-center gap-1">
        <button type="button" class="p-1 text-gray-400 hover:text-white transition" title="缩小" @click="zoom = Math.max(0.25, zoom * 0.8)">
          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="p-1 text-gray-400 hover:text-white transition" title="放大" @click="zoom = Math.min(4, zoom * 1.25)">
          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="h-4 w-px bg-gray-800 mx-1"></div>
    </div>
  </div>

  <!-- 项目设置弹窗(画布尺寸/背景色/fps;x-data 子作用域,事件总线驱动) -->
  <div x-data="projectSettingsModalComponent()" x-show="open" x-cloak
       class="fixed inset-0 z-[95] flex items-center justify-center p-4"
       style="background:rgba(0,0,0,.6);backdrop-filter:blur(2px)"
       @click.self="open = false">
    <div class="w-full max-w-sm sm:max-w-md rounded-xl bg-gray-950 border border-gray-800 shadow-2xl p-5 text-gray-200 max-h-[85vh] overflow-y-auto">
      <h3 class="text-sm font-semibold flex items-center gap-2 mb-4">
        <svg class="w-3.5 h-3.5 text-indigo-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.6V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.03-1.6 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.6-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.6-1.03 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34 1.7 1.7 0 0 0 1.03-1.6V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.6 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87 1.7 1.7 0 0 0 1.6 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.6 1.03z"/></svg>
        项目设置
      </h3>

      <!-- 画布尺寸 -->
      <div class="mb-3.5">
        <label class="block text-[11px] text-gray-500 mb-1.5">画布尺寸</label>
        <div class="grid grid-cols-5 gap-1.5 mb-2">
          <template x-for="p in sizePresets" :key="p.id">
            <button type="button" @click="applySize(p)"
                    class="px-1 py-1 rounded border text-[10px] transition"
                    :class="width === p.width && height === p.height ? 'border-indigo-500 bg-indigo-500/10 text-indigo-300' : 'border-gray-800 text-gray-500 hover:border-gray-600'"
                    x-text="p.name.split(' ')[0]"></button>
          </template>
        </div>
        <div class="flex items-center gap-2">
          <input type="number" min="16" max="7680" x-model.number="width" class="w-full bg-gray-900 border border-gray-800 rounded px-2 py-1.5 text-[11px] font-mono text-gray-200 focus:outline-none focus:border-indigo-500">
          <span class="text-gray-500 text-xs">×</span>
          <input type="number" min="16" max="4320" x-model.number="height" class="w-full bg-gray-900 border border-gray-800 rounded px-2 py-1.5 text-[11px] font-mono text-gray-200 focus:outline-none focus:border-indigo-500">
        </div>
      </div>

      <!-- 背景色 -->
      <div class="mb-3.5">
        <label class="block text-[11px] text-gray-500 mb-1.5">背景色</label>
        <div class="flex gap-2">
          <template x-for="b in bgColors" :key="b.id">
            <button type="button" @click="background_color = b.id"
                    class="flex-1 px-2 py-1.5 rounded-lg border text-[11px] transition"
                    :class="background_color === b.id ? 'border-indigo-500 bg-indigo-500/10 text-white' : 'border-gray-800 text-gray-400 hover:border-gray-600'"
                    x-text="b.name"></button>
          </template>
        </div>
      </div>

      <!-- fps -->
      <div class="mb-4">
        <label class="block text-[11px] text-gray-500 mb-1.5">帧率</label>
        <div class="flex gap-2">
          <template x-for="f in fpsOptions" :key="f.value">
            <button type="button" @click="fps = f.value"
                    class="flex-1 px-2 py-1.5 rounded-lg border text-[11px] transition"
                    :class="fps === f.value ? 'border-indigo-500 bg-indigo-500/10 text-white' : 'border-gray-800 text-gray-400 hover:border-gray-600'"
                    x-text="f.value + ' fps'"></button>
          </template>
        </div>
      </div>

      <div class="flex justify-end gap-2">
        <button type="button" @click="open = false" class="px-3 py-1.5 rounded-lg text-xs text-gray-400 hover:bg-gray-900 transition">取消</button>
        <button type="button" @click="save()" class="px-4 py-1.5 rounded-lg text-xs font-medium bg-indigo-500 hover:bg-indigo-400 text-white transition">保存</button>
      </div>
    </div>
  </div>

  <!-- 时间轴主体 -->
  <div class="flex-1 min-h-0 overflow-auto relative" @click="seek($event)" @keydown="onKey($event)" tabindex="0">
    <div class="min-w-full inline-block" :style="'width:' + trackWidth + 'px'">
      <!-- Ruler（对齐 TimelineRuler：动态刻度间隔 + 内容时长高亮区 + END 标记） -->
      <div class="h-7 border-b border-gray-800 bg-gray-950/60 relative text-[10px] font-mono text-gray-500" @click.stop="seek($event)" @mousedown.stop="seek($event)">
        <!-- 内容时长高亮区(播放素材总长,上游 Content Boundary + END) -->
        <div class="absolute top-0 bottom-0 left-0 bg-indigo-500/10 border-r-2 border-indigo-400/80 pointer-events-none z-10"
             :style="'width:' + (contentSec * pps) + 'px'" title="内容时长">
          <div class="absolute right-1 bottom-0.5 text-[10px] font-mono text-indigo-300 font-bold bg-indigo-950/90 px-1 rounded shadow-sm border border-indigo-500/30">END</div>
        </div>
        <!-- 动态刻度:pps<30 → 5s,<60 → 2s,否则 1s(上游 timeMarks) -->
        <template x-for="mark in rulerMarks()" :key="mark.t">
          <div class="absolute top-0 bottom-0 border-l border-gray-700/80 flex flex-col justify-between pl-1 pointer-events-none"
               :style="'left:' + mark.pos + 'px'">
            <span class="text-[10px] font-mono text-gray-400 font-medium tracking-tight" x-text="mark.label"></span>
            <div class="w-px h-1.5 bg-gray-700"></div>
          </div>
        </template>
      </div>

      <!-- 轨道区 -->
      <div class="flex">
        <!-- 轨道头列（对齐 TrackHeader；点击选中轨道 → Ducking/Waveform 检查器） -->
        <div class="w-56 flex-shrink-0 border-r border-gray-800 bg-gray-950/60 z-10 relative">
          <template x-for="tr in videoTracks()" :key="'h' + tr.id">
            <div class="h-14 border-b border-gray-800/80 flex items-center gap-1 px-1 cursor-pointer transition"
                 :class="selectedTrackId === tr.id ? 'text-indigo-400 bg-indigo-500/10 border-l-2 border-l-indigo-500' : 'text-gray-500 hover:text-gray-300'"
                 @click.stop="selectTrack(tr)">
              <div class="w-6 h-6 rounded flex items-center justify-center flex-shrink-0 bg-indigo-500/20 text-indigo-400">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              </div>
              <div class="flex flex-col gap-1 flex-1 min-w-0">
                <button type="button" class="p-1 rounded hover:text-indigo-300 transition" :title="tr.muted ? '取消静音' : '静音轨道'"
                        :class="tr.muted ? 'text-red-400' : 'text-gray-600 hover:text-gray-300'"
                        @click.stop="toggleMute(tr)">
                  <svg class="w-3 h-3" viewBox="0 0 24 24" fill="currentColor"><path x-show="!tr.muted" d="M3 10v4a1 1 0 0 0 1 1h3l4 4V5L7 9H4a1 1 0 0 0-1 1zM16 9l5 6M21 9l-5 6"/><path x-show="tr.muted" d="M3 10v4a1 1 0 0 0 1 1h3l4 4V5L7 9H4a1 1 0 0 0-1 1z"/></svg>
                </button>
                <button type="button" class="p-1 rounded text-gray-600 hover:text-red-400 transition" title="删除轨道"
                        @click.stop="removeTrack(tr)">
                  <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7h12l-1 14H7z" stroke-linejoin="round"/><path d="M9 4h6l1 3H8z" stroke-linejoin="round"/></svg>
                </button>
              </div>
            </div>
          </template>
          <template x-for="tr in audioTracks()" :key="'h' + tr.id">
            <div class="h-14 border-b border-gray-800/80 flex items-center gap-1 px-1 cursor-pointer transition"
                 :class="selectedTrackId === tr.id ? 'text-indigo-400 bg-indigo-500/10 border-l-2 border-l-indigo-500' : 'text-gray-500 hover:text-gray-300'"
                 @click.stop="selectTrack(tr)">
              <div class="w-6 h-6 rounded flex items-center justify-center flex-shrink-0 bg-emerald-500/20 text-emerald-400">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4a1 1 0 0 0 1 1h3l4 4V5L7 9H4a1 1 0 0 0-1 1z"/></svg>
              </div>
              <div class="flex flex-col gap-1 flex-1 min-w-0">
                <button type="button" class="p-1 rounded hover:text-indigo-300 transition" :title="tr.muted ? '取消静音' : '静音轨道'"
                        :class="tr.muted ? 'text-red-400' : 'text-gray-600 hover:text-gray-300'"
                        @click.stop="toggleMute(tr)">
                  <svg class="w-3 h-3" viewBox="0 0 24 24" fill="currentColor"><path x-show="!tr.muted" d="M3 10v4a1 1 0 0 0 1 1h3l4 4V5L7 9H4a1 1 0 0 0-1 1zM16 9l5 6M21 9l-5 6"/><path x-show="tr.muted" d="M3 10v4a1 1 0 0 0 1 1h3l4 4V5L7 9H4a1 1 0 0 0-1 1z"/></svg>
                </button>
                <button type="button" class="p-1 rounded text-gray-600 hover:text-red-400 transition" title="删除轨道"
                        @click.stop="removeTrack(tr)">
                  <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7h12l-1 14H7z" stroke-linejoin="round"/><path d="M9 4h6l1 3H8z" stroke-linejoin="round"/></svg>
                </button>
              </div>
            </div>
          </template>
          <template x-for="tr in otherTracks()" :key="'h' + tr.id">
            <div class="h-14 border-b border-gray-800/80 flex items-center gap-1 px-1 cursor-pointer transition"
                 :class="selectedTrackId === tr.id ? 'text-indigo-400 bg-indigo-500/10 border-l-2 border-l-indigo-500' : 'text-gray-500 hover:text-gray-300'"
                 @click.stop="selectTrack(tr)">
              <div class="w-6 h-6 rounded flex items-center justify-center flex-shrink-0 bg-amber-500/20 text-amber-400">
                <span class="text-[10px] font-mono font-bold" x-text="tr.kind.slice(0,2)"></span>
              </div>
              <div class="flex flex-col gap-1 flex-1 min-w-0">
                <button type="button" class="p-1 rounded hover:text-indigo-300 transition" :title="tr.muted ? '取消静音' : '静音轨道'"
                        :class="tr.muted ? 'text-red-400' : 'text-gray-600 hover:text-gray-300'"
                        @click.stop="toggleMute(tr)">
                  <svg class="w-3 h-3" viewBox="0 0 24 24" fill="currentColor"><path x-show="!tr.muted" d="M3 10v4a1 1 0 0 0 1 1h3l4 4V5L7 9H4a1 1 0 0 0-1 1zM16 9l5 6M21 9l-5 6"/><path x-show="tr.muted" d="M3 10v4a1 1 0 0 0 1 1h3l4 4V5L7 9H4a1 1 0 0 0-1 1z"/></svg>
                </button>
                <button type="button" class="p-1 rounded text-gray-600 hover:text-red-400 transition" title="删除轨道"
                        @click.stop="removeTrack(tr)">
                  <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7h12l-1 14H7z" stroke-linejoin="round"/><path d="M9 4h6l1 3H8z" stroke-linejoin="round"/></svg>
                </button>
              </div>
            </div>
          </template>
        </div>

        <!-- 轨道内容 -->
        <div class="flex-1 relative">
          <!-- 每条视频/overlay 轨道一行 -->
          <template x-for="(tr, ti) in videoTracks()" :key="tr.id">
            <div class="h-14 border-b border-gray-800/80 bg-gray-950/40 relative"
                 @dragover.prevent="onTrackDragOver($event, 'video')"
                 @drop.prevent="onTrackDrop($event, 'video')"
                 @dragleave.self="dragGhost.show = false">
              <!-- 拖拽幻影(对齐 vidonex TrackRow ghost:兼容靛蓝 / 重叠红 / 不兼容红;x-show 分支避免 template 嵌套) -->
              <div x-show="ghostVisible('video')" x-cloak
                   class="absolute top-1 bottom-1 rounded-lg border-2 pointer-events-none z-30 flex items-center justify-between px-3 text-xs text-white backdrop-blur-sm transition-all duration-75"
                   :class="dragGhost.compatible && !dragGhost.overlap ? 'border-indigo-400 timeline-drag-shimmer shadow-[0_0_20px_rgba(99,102,241,0.4)]' : 'border-red-500 shadow-[0_0_15px_rgba(239,68,68,0.5)]'"
                   :style="'left:' + dragGhost.left + 'px;width:' + dragGhost.width + 'px'">
                <!-- 分支1:兼容且不重叠 → 靛蓝预览 -->
                <div x-show="dragGhost.compatible && !dragGhost.overlap" class="flex items-center gap-2 min-w-0 w-full">
                  <svg class="w-3 h-3 text-indigo-300 flex-shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                  <span class="text-[11px] font-sans font-semibold truncate text-white drop-shadow" x-text="dragGhost.title"></span>
                  <span x-show="dragGhost.snapped" class="text-[10px] font-mono font-bold bg-indigo-500/90 text-white px-1 py-0.5 rounded flex-shrink-0"
                        x-text="dragGhost.snapType === 'playhead' ? '播放头' : '磁吸对齐'"></span>
                  <span class="text-[10px] font-mono text-indigo-200/80 flex-shrink-0" x-text="Number(dragGhost.duration).toFixed(1) + 's'"></span>
                </div>
                <!-- 分支2:兼容但重叠 → 红色阻断提示 -->
                <div x-show="dragGhost.compatible && dragGhost.overlap" class="truncate drop-shadow w-full">
                  不能与现有片段重叠(松开取消)
                </div>
                <!-- 分支3:不兼容 → 红色类型提示 -->
                <div x-show="!dragGhost.compatible" class="truncate drop-shadow w-full">
                  轨道类型不兼容
                </div>
              </div>
              <template x-for="clip in tr.clips" :key="clip.id">
                <div :style="clipStyle(clip)" :class="clipClass(clip)"
                     :draggable="true"
                     @mousedown.stop="startDrag($event, clip, ti)"
                     @dragstart.stop="beginClipDnD($event, clip)"
                     @click.stop="select(clip)"
                     @contextmenu.stop="openCtxMenu($event, clip, tr)"
                     @dblclick.stop="">
                  <!-- filmstrip 胶片条(对齐上游 ClipItem:thumbnail 平铺 + 分帧线 + 渐变) -->
                  <div class="absolute inset-0 opacity-30 pointer-events-none overflow-hidden flex items-center"
                       x-show="thumbFor(clip)">
                    <div class="w-full h-full" :style="'backgroundImage:url(' + thumbFor(clip) + ');backgroundRepeat:repeat-x;backgroundSize:auto 100%'"></div>
                    <div class="absolute inset-0 pointer-events-none" style="background:repeating-linear-gradient(90deg,transparent,transparent 78px,rgba(0,0,0,0.7) 78px,rgba(0,0,0,0.7) 80px)"></div>
                    <div class="absolute inset-0 bg-gradient-to-r from-gray-950/80 via-transparent to-gray-950/80"></div>
                  </div>
                  <div class="absolute inset-0 flex items-center px-1.5 gap-1 pointer-events-none">
                    <template x-if="thumbFor(clip)">
                      <img :src="thumbFor(clip)" class="w-7 h-7 rounded flex-shrink-0 border border-white/20 shadow bg-gray-950 object-cover">
                    </template>
                    <svg x-show="!thumbFor(clip)" class="w-3 h-3 text-indigo-300 flex-shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <span class="text-[10px] font-medium text-gray-100 truncate" :class="thumbFor(clip) ? 'text-[10px]' : ''" x-text="clip.name"></span>
                  </div>
                  <!-- trim 手柄(对齐 vidonex:左右缘可拖,悬停显现 + indigo 圆点) -->
                  <div class="absolute left-0 top-0 bottom-0 w-3 bg-white/10 hover:bg-indigo-400 hover:w-3.5 cursor-ew-resize opacity-0 group-hover:opacity-100 transition z-30 flex items-center justify-center pointer-events-auto"
                       @mousedown.stop="startTrim($event, clip, ti, 'left')">
                    <div class="w-0.5 h-4 bg-white/90 rounded-full"></div>
                  </div>
                  <div class="absolute right-0 top-0 bottom-0 w-3 bg-white/10 hover:bg-indigo-400 hover:w-3.5 cursor-ew-resize opacity-0 group-hover:opacity-100 transition z-30 flex items-center justify-center pointer-events-auto"
                       @mousedown.stop="startTrim($event, clip, ti, 'right')">
                    <div class="w-0.5 h-4 bg-white/90 rounded-full"></div>
                  </div>
                  <!-- 选中描边 -->
                  <div x-show="selectedId === clip.id"
                       class="absolute inset-0 border-2 border-indigo-400 rounded-md pointer-events-none"></div>
                </div>
              </template>
              <!-- 转场层(对齐 vidonex TransitionHandle:轨道容器级,横跨交界 amber 条带;
                   已有转场 = ribbon(点击开设置弹窗 / 双击移除);无 = 交界 + 号) -->
              <template x-for="t in (tr.transitions || [])" :key="t.from + '>' + t.to">
                <div class="absolute top-1 bottom-0.5 z-20 rounded-md border border-amber-500/80 bg-gradient-to-r from-amber-500/25 via-amber-500/40 to-amber-500/25 shadow-[0_0_12px_rgba(245,158,11,0.25)] flex items-center justify-between px-1.5 cursor-pointer overflow-hidden select-none"
                     :style="transitionRibbonStyle2(tr, t)"
                     :title="'转场: ' + transitionTypeLabel(t.type) + ' (' + t.duration + 's)'"
                     @click.stop="openTransitionModal(tr, fromClipOf(tr, t))"
                     @dblclick.stop="removeTransition(t.from, t.to)">
                  <!-- 斜纹装饰 -->
                  <div class="absolute inset-0 opacity-15 pointer-events-none" style="background:linear-gradient(45deg,rgba(255,255,255,0.4) 25%,transparent 25%,transparent 50%,rgba(255,255,255,0.4) 50%,rgba(255,255,255,0.4) 75%,transparent 75%,transparent);background-size:12px 12px"></div>
                  <span class="text-[10px] font-semibold font-mono text-amber-200 truncate relative z-10" x-text="transitionTypeLabel(t.type)"></span>
                  <span class="text-[10px] font-mono font-bold text-amber-950 bg-amber-400/90 px-1 py-0.5 rounded shadow-sm relative z-10 flex-shrink-0" x-text="Number(t.duration).toFixed(1) + 's'"></span>
                </div>
              </template>
              <template x-for="clip in tr.clips" :key="'plus-' + clip.id">
                <template x-if="nextClipId(tr, clip) && !transitionOf(tr, clip)">
                  <button type="button"
                          class="absolute top-1/2 -translate-y-1/2 w-4 h-4 rounded-full z-20 flex items-center justify-center bg-gray-800 hover:bg-gray-700 text-gray-400 hover:text-white border border-gray-700 hover:scale-110 transition shadow-md cursor-pointer"
                          :style="'left:' + ((clip.start + clip.duration) * pps) + 'px'"
                          title="添加转场"
                          @click.stop="openTransitionModal(tr, clip)">
                    <svg class="w-2.5 h-2.5 pointer-events-none" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5v14M5 12h14"/></svg>
                  </button>
                </template>
              </template>
            </div>
          </template>
          <!-- 音频/波形轨道 -->
          <template x-for="(tr, ti) in audioTracks()" :key="tr.id">
            <div class="h-14 border-b border-gray-800/80 bg-gray-950/40 relative"
                 @dragover.prevent="onTrackDragOver($event, 'audio')"
                 @drop.prevent="onTrackDrop($event, 'audio')"
                 @dragleave.self="dragGhost.show = false">
              <!-- 拖拽幻影(对齐 vidonex TrackRow ghost;音频轨复用,色系 emerald) -->
              <div x-show="ghostVisible('audio')" x-cloak
                   class="absolute top-1 bottom-1 rounded-lg border-2 pointer-events-none z-30 flex items-center justify-between px-3 text-xs text-white backdrop-blur-sm transition-all duration-75"
                   :class="dragGhost.compatible && !dragGhost.overlap ? 'border-emerald-400 timeline-drag-shimmer shadow-[0_0_20px_rgba(16,185,129,0.4)]' : 'border-red-500 shadow-[0_0_15px_rgba(239,68,68,0.5)]'"
                   :style="'left:' + dragGhost.left + 'px;width:' + dragGhost.width + 'px'">
                <div x-show="dragGhost.compatible && !dragGhost.overlap" class="flex items-center gap-2 min-w-0 w-full">
                  <svg class="w-3 h-3 text-emerald-300 flex-shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4a1 1 0 0 0 1 1h3l4 4V5L7 9H4a1 1 0 0 0-1 1z"/></svg>
                  <span class="text-[11px] font-sans font-semibold truncate text-white drop-shadow" x-text="dragGhost.title"></span>
                  <span x-show="dragGhost.snapped" class="text-[10px] font-mono font-bold bg-emerald-500/90 text-white px-1 py-0.5 rounded flex-shrink-0"
                        x-text="dragGhost.snapType === 'playhead' ? '播放头' : '磁吸对齐'"></span>
                  <span class="text-[10px] font-mono text-emerald-200/80 flex-shrink-0" x-text="Number(dragGhost.duration).toFixed(1) + 's'"></span>
                </div>
                <div x-show="dragGhost.compatible && dragGhost.overlap" class="truncate drop-shadow w-full">
                  不能与现有片段重叠(松开取消)
                </div>
                <div x-show="!dragGhost.compatible" class="truncate drop-shadow w-full">
                  轨道类型不兼容
                </div>
              </div>
              <template x-for="clip in tr.clips" :key="clip.id">
                <div :style="clipStyle(clip)" :class="clipClass(clip)"
                     :draggable="true"
                     @mousedown.stop="startDrag($event, clip, ti)"
                     @dragstart.stop="beginClipDnD($event, clip)"
                     @click.stop="select(clip)"
                     @contextmenu.stop="openCtxMenu($event, clip, tr)">
                  <div class="absolute inset-0 flex items-center px-1.5 gap-1 pointer-events-none">
                    <svg class="w-3 h-3 text-emerald-400 flex-shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4a1 1 0 0 0 1 1h3l4 4V5L7 9H4a1 1 0 0 0-1 1z"/></svg>
                    <span class="text-[10px] font-medium text-gray-300 truncate" x-text="clip.name"></span>
                  </div>
                  <!-- 音频波形(种子随机,对齐 vidonex ClipWaveform) -->
                  <canvas class="absolute inset-x-0 bottom-0 h-1/2 opacity-50 pointer-events-none"
                          :data-seed="clip.source + '-' + clip.id"
                          :data-kind="tr.kind"
                          x-init="drawWaveform($el)"></canvas>
                  <!-- trim 手柄(对齐 vidonex:悬停显现 + indigo 圆点) -->
                  <div class="absolute left-0 top-0 bottom-0 w-3 bg-white/10 hover:bg-indigo-400 hover:w-3.5 cursor-ew-resize opacity-0 group-hover:opacity-100 transition z-30 flex items-center justify-center pointer-events-auto"
                       @pointerdown.stop="beginTrim($event, clip, 'left')">
                    <div class="w-0.5 h-4 bg-white/90 rounded-full"></div>
                  </div>
                  <div class="absolute right-0 top-0 bottom-0 w-3 bg-white/10 hover:bg-indigo-400 hover:w-3.5 cursor-ew-resize opacity-0 group-hover:opacity-100 transition z-30 flex items-center justify-center pointer-events-auto"
                       @pointerdown.stop="beginTrim($event, clip, 'right')">
                    <div class="w-0.5 h-4 bg-white/90 rounded-full"></div>
                  </div>
                  <!-- 选中描边 -->
                  <div x-show="selectedId === clip.id"
                       class="absolute inset-0 border-2 border-emerald-400 rounded-md pointer-events-none"></div>
                </div>
              </template>
              <!-- 转场层(音频轨同视频轨:交界 amber 条带 + 添加 + 号) -->
              <template x-for="t in (tr.transitions || [])" :key="t.from + '>' + t.to">
                <div class="absolute top-1 bottom-0.5 z-20 rounded-md border border-amber-500/80 bg-gradient-to-r from-amber-500/25 via-amber-500/40 to-amber-500/25 shadow-[0_0_12px_rgba(245,158,11,0.25)] flex items-center justify-between px-1.5 cursor-pointer overflow-hidden select-none"
                     :style="transitionRibbonStyle2(tr, t)"
                     :title="'转场: ' + transitionTypeLabel(t.type) + ' (' + t.duration + 's)'"
                     @click.stop="openTransitionModal(tr, fromClipOf(tr, t))"
                     @dblclick.stop="removeTransition(t.from, t.to)">
                  <div class="absolute inset-0 opacity-15 pointer-events-none" style="background:linear-gradient(45deg,rgba(255,255,255,0.4) 25%,transparent 25%,transparent 50%,rgba(255,255,255,0.4) 50%,rgba(255,255,255,0.4) 75%,transparent 75%,transparent);background-size:12px 12px"></div>
                  <span class="text-[10px] font-semibold font-mono text-amber-200 truncate relative z-10" x-text="transitionTypeLabel(t.type)"></span>
                  <span class="text-[10px] font-mono font-bold text-amber-950 bg-amber-400/90 px-1 py-0.5 rounded shadow-sm relative z-10 flex-shrink-0" x-text="Number(t.duration).toFixed(1) + 's'"></span>
                </div>
              </template>
              <template x-for="clip in tr.clips" :key="'plus-' + clip.id">
                <template x-if="nextClipId(tr, clip) && !transitionOf(tr, clip)">
                  <button type="button"
                          class="absolute top-1/2 -translate-y-1/2 w-4 h-4 rounded-full z-20 flex items-center justify-center bg-gray-800 hover:bg-gray-700 text-gray-400 hover:text-white border border-gray-700 hover:scale-110 transition shadow-md cursor-pointer"
                          :style="'left:' + ((clip.start + clip.duration) * pps) + 'px'"
                          title="添加转场"
                          @click.stop="openTransitionModal(tr, clip)">
                    <svg class="w-2.5 h-2.5 pointer-events-none" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5v14M5 12h14"/></svg>
                  </button>
                </template>
              </template>
            </div>
          </template>
          <!-- 空轨道提示 -->
          <div x-show="!loading && !videoTracks().length && !audioTracks().length"
               class="absolute inset-0 flex items-center justify-center text-gray-600 text-[10px]">
            <span>轨道为空 — 从媒体库添加素材</span>
          </div>

          <!-- 播放头(对齐 TimelineRuler playhead:indigo 竖线 + 顶部圆角拖动块 + pointer 拖拽 scrub) -->
          <div class="absolute top-[-28px] bottom-0 border-l-2 border-indigo-500 z-20 cursor-ew-resize group"
               :style="'left:' + (64 + playhead * pps) + 'px'"
               @pointerdown.stop="beginScrub($event)"
               @dblclick.stop>
            <!-- 拖动块(圆角,吸附跟手):比竖线宽,点击更准 -->
            <div class="absolute -left-[7px] top-[-3px] w-4 h-3.5 rounded-t-md rounded-b-sm bg-indigo-500 shadow-md shadow-indigo-950/60 group-hover:bg-indigo-400 transition-colors"></div>
            <div class="absolute -left-[7px] top-[-3px] w-4 h-3.5 flex items-end justify-center pb-0.5">
              <svg class="w-2.5 h-2 text-white opacity-80" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v2l4 3-4 3v2h8V5z"/></svg>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 加载态 / 错误态 -->
    <div x-show="loading" class="absolute inset-0 flex items-center justify-center bg-gray-950/70 text-gray-500 text-xs">
      <svg class="animate-spin w-4 h-4 mr-2 text-indigo-400" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" opacity="0.25"/><path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      加载时间轴…
    </div>
    <div x-show="error" class="absolute inset-0 flex items-center justify-center bg-gray-950/80 text-red-400 text-xs p-4 text-center" x-text="error"></div>
    <!-- 未打开项目 -->
    <div x-show="!loading && !pid" class="absolute inset-0 flex items-center justify-center text-gray-600 text-[10px]">
      <span>从左侧打开项目查看时间轴</span>
    </div>
  </div>

  <!-- 转场设置弹窗(对齐 vidonex TransitionHandle 弹窗:类型选择 + 时长滑块 + 移除) -->
  <template x-if="transitionModal.open">
  <div x-cloak
       class="fixed inset-0 z-[85] flex items-center justify-center p-4"
       style="background:rgba(0,0,0,.6);backdrop-filter:blur(2px)"
       @click.self="closeTransitionModal()">
      <div class="w-full max-w-md rounded-xl bg-gray-950 border border-gray-800 shadow-2xl p-5 text-gray-200">
        <h3 class="text-sm font-semibold flex items-center gap-2 mb-4">
          <svg class="w-3.5 h-3.5 text-amber-400" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          转场设置
        </h3>

        <!-- Clip 交界说明 -->
        <div class="flex items-center justify-between p-2 rounded bg-gray-900/60 border border-gray-800 text-[11px] text-gray-400 mb-4">
          <span class="truncate font-mono text-gray-200 max-w-[42%]" x-text="transitionModal.fromClip.id"></span>
          <svg class="w-3.5 h-3.5 text-amber-400 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="truncate font-mono text-gray-200 max-w-[42%]" x-text="transitionModal.toId"></span>
        </div>

        <!-- 类型选择(分类分组) -->
        <div class="mb-3.5">
          <label class="block text-[11px] text-gray-500 mb-1.5">类型</label>
          <div class="grid grid-cols-2 gap-1.5">
            <template x-for="t in transitionTypes()" :key="t.value">
              <button type="button" @click="transitionModal.type = t.value"
                      class="px-2 py-1.5 rounded-lg border text-[11px] transition text-left"
                      :class="transitionModal.type === t.value ? 'border-amber-500 bg-amber-500/15 text-amber-300' : 'border-gray-800 text-gray-400 hover:border-gray-600'">
                <span x-text="t.label"></span>
                <span class="block text-[10px] text-gray-600" x-text="t.value"></span>
              </button>
            </template>
          </div>
        </div>

        <!-- 时长 -->
        <template x-if="transitionModal.type !== 'none'">
          <div class="mb-4">
            <label class="block text-[11px] text-gray-500 mb-1.5">时长(秒)</label>
            <div class="flex items-center gap-3">
              <input type="number" step="0.1" min="0.1" :max="transitionMaxDuration()" x-model="transitionModal.duration"
                     class="w-24 bg-gray-900 border border-gray-800 rounded px-2.5 py-1.5 font-mono text-gray-200 focus:outline-none focus:border-amber-500 text-xs">
              <input type="range" step="0.05" min="0.1" :max="transitionMaxDuration()" x-model="transitionModal.duration"
                     class="flex-1 accent-amber-500 h-1.5 bg-gray-800 rounded cursor-pointer">
            </div>
            <div class="flex items-center gap-1.5 pt-1.5">
              <span class="text-[10px] text-gray-500 mr-1">预设:</span>
              <template x-for="p in [0.5, 1.0, 1.5, 2.0]" :key="p">
                <template x-if="p <= transitionMaxDuration()">
                  <button type="button" @click="transitionModal.duration = p"
                          class="px-2 py-0.5 rounded text-[10px] font-mono border transition"
                          :class="Math.abs(Number(transitionModal.duration) - p) < 0.01 ? 'bg-amber-500 text-black border-amber-400 font-semibold' : 'bg-gray-900 text-gray-400 border-gray-800 hover:border-gray-700'"
                          x-text="p.toFixed(1) + 's'"></button>
                </template>
              </template>
            </div>
          </div>
        </template>

        <div class="flex items-center justify-between pt-4 border-t border-gray-800">
          <button type="button" x-show="transitionModal.existed"
                  class="px-2.5 py-1.5 rounded-lg text-xs text-red-400 hover:bg-red-950/30 transition flex items-center gap-1"
                  @click="removeTransitionModal()">
            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7h12l-1 14H7zM9 4h6l1 3H8z"/></svg>
            移除
          </button>
          <div class="flex items-center gap-2">
            <button type="button" @click="closeTransitionModal()" class="px-3 py-1.5 rounded-lg text-xs text-gray-400 hover:bg-gray-900 transition">取消</button>
            <button type="button" @click="applyTransitionModal()"
                    class="px-4 py-1.5 rounded-lg text-xs font-medium bg-amber-500 hover:bg-amber-400 text-black transition">应用</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- 右键上下文菜单(对齐 vidonex ClipItem UContextMenu 四段式:标题/主操作/检查/删除) -->
  <div x-show="ctxMenu.open" x-cloak
       class="fixed z-[95] w-52 rounded-lg bg-gray-900 border border-gray-800 shadow-2xl py-1 overflow-hidden"
       :style="'left:' + Math.min(ctxMenu.x, window.innerWidth - 220) + 'px;top:' + Math.min(ctxMenu.y, window.innerHeight - 300) + 'px'">
      <div>
        <!-- 段 1:标题与信息(禁用) -->
        <div class="px-3 py-1.5 text-[11px] font-semibold text-gray-200 truncate" x-text="ctxMenu.clip ? ctxMenu.clip.name : ''"></div>
        <div class="px-3 py-1 text-[10px] font-mono text-gray-500 flex items-center gap-1">
          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 5h-2v7l5.5 3.3 1-1.7-4.5-2.7z"/></svg>
          <span x-text="ctxMenu.clip ? ('起 ' + Number(ctxMenu.clip.start).toFixed(2) + 's · 长 ' + Number(ctxMenu.clip.duration).toFixed(2) + 's') : ''"></span>
        </div>
        <div class="my-1 border-t border-gray-800"></div>

        <!-- 段 2:主操作 -->
        <button type="button" class="w-full flex items-center gap-2 px-3 py-1.5 text-left text-[11px] text-gray-300 hover:bg-gray-800 transition" @click="ctxDuplicate()">
          <svg class="w-3.5 h-3.5 text-gray-500" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h12v12H4zM16 8h4v12H8v-4"/></svg>
          复制 Clip
          <kbd class="ml-auto text-[10px] text-gray-600 font-mono">Ctrl+D</kbd>
        </button>
        <button type="button" class="w-full flex items-center gap-2 px-3 py-1.5 text-left text-[11px] text-gray-300 hover:bg-gray-800 transition"
                @click="splitAtCtx()">
          <svg class="w-3.5 h-3.5 text-gray-500" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4v16l8-8zM14 12l4-8v16z"/></svg>
          在播放头分割
          <kbd class="ml-auto text-[10px] text-gray-600 font-mono">S</kbd>
        </button>
        <div class="my-1 border-t border-gray-800"></div>

        <!-- 段 3:检查 -->
        <button type="button" class="w-full flex items-center gap-2 px-3 py-1.5 text-left text-[11px] text-gray-300 hover:bg-gray-800 transition" @click="ctxInspect()">
          <svg class="w-3.5 h-3.5 text-gray-500" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm-8 13a8 8 0 0 1 16 0v1H4z"/></svg>
          在检查器中查看
        </button>
        <button type="button" class="w-full flex items-center gap-2 px-3 py-1.5 text-left text-[11px] text-gray-300 hover:bg-gray-800 transition" @click="ctxProbe()">
          <svg class="w-3.5 h-3.5 text-gray-500" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2zm0-8h-2V7h2z"/></svg>
          素材详情
        </button>
        <div class="my-1 border-t border-gray-800"></div>

        <!-- 段 4:删除 -->
        <button type="button" class="w-full flex items-center gap-2 px-3 py-1.5 text-left text-[11px] text-red-400 hover:bg-red-950/30 transition" @click="ctxDelete()">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7h12l-1 14H7z" stroke-linejoin="round"/><path d="M9 4h6l1 3H8z" stroke-linejoin="round"/></svg>
          删除 Clip
          <kbd class="ml-auto text-[10px] text-gray-600 font-mono">Del</kbd>
        </button>
      </div>
  </div>
