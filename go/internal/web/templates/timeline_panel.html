{{/* 时间轴面板（对齐 vidonex TimelineContainer：工具栏 + 标尺 + 真实 clip 轨道行） */}}
{{/* 数据源：/api/projects/{id}/timeline —— 解析项目 spec 的数值化时间轴 */}}
<div class="h-full flex flex-col bg-gray-950 select-none overflow-hidden" dir="ltr"
     x-data="timelineEditor({{if .Project}}{{.Project.ID}}{{else}}null{{end}})">
  <!-- Timeline Actions Toolbar（对齐 vidonex：h-10 + 按钮组 + Snap 开关） -->
  <div class="h-10 border-b border-gray-800 px-3 bg-gray-950/80 flex items-center justify-between z-20 flex-shrink-0">
    <div class="flex items-center gap-1.5">
      <!-- 轨道菜单(对齐 vidonex addTrack:video/overlay/audio/waveform/subtitle) -->
      <div class="relative" x-data="{ trackMenu: false }" @click.away="trackMenu = false">
        <button type="button" @click="trackMenu = !trackMenu"
                class="px-2.5 py-1 rounded-md bg-gray-900 border border-gray-700 text-xs text-gray-200 hover:border-indigo-500 transition flex items-center gap-1">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5v14M5 12h14"/></svg>
          <span>轨道</span>
          <svg class="w-2.5 h-2.5 text-gray-500" viewBox="0 0 24 24" fill="currentColor"><path d="M6 9l6 6 6-6z"/></svg>
        </button>
        <div x-show="trackMenu" x-cloak class="absolute top-8 left-0 z-40 w-44 rounded-lg bg-gray-900 border border-gray-800 shadow-2xl py-1">
          <template x-for="k in ['video', 'audio', 'overlay', 'subtitle', 'waveform']" :key="k">
            <button type="button" class="w-full px-3 py-1.5 text-left text-[11px] text-gray-300 hover:bg-gray-800 transition flex items-center justify-between"
                    @click="addTrack(k); trackMenu = false">
              <span x-text="'添加 ' + ({video:'视频', audio:'音频', overlay:'叠加', subtitle:'字幕', waveform:'波形'})[k] + ' 轨道'"></span>
              <svg class="w-3 h-3 text-gray-600" viewBox="0 0 24 24" fill="currentColor" x-show="k === 'video'"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </template>
          <div class="border-t border-gray-800 my-1"></div>
          <button type="button" class="w-full px-3 py-1.5 text-left text-[11px] text-gray-300 hover:bg-gray-800 transition flex items-center gap-1.5"
                  :class="selectedId ? '' : 'opacity-40 cursor-not-allowed'" @click="duplicateClip(); trackMenu = false">
            <svg class="w-3 h-3 text-indigo-400" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/></svg>
            复制选中 clip
          </button>
        </div>
      </div>
      <div class="h-4 w-px bg-gray-800 mx-1"></div>
      <button type="button" class="p-1.5 rounded-md text-gray-400 hover:text-white hover:bg-gray-900 transition" title="撤消 (Ctrl+Z)" :class="canUndo() ? '' : 'opacity-40 pointer-events-none'" @click="undo()">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10a6 6 0 0 1 0 12h-3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="p-1.5 rounded-md text-gray-400 hover:text-white hover:bg-gray-900 transition" title="重做 (Ctrl+Shift+Z)" :class="canRedo() ? '' : 'opacity-40 pointer-events-none'" @click="redo()">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14l5-5-5-5" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 9H10a6 6 0 0 0 0 12h3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="h-4 w-px bg-gray-800 mx-1"></div>
      <button type="button" class="px-2 py-1 rounded-md text-xs text-gray-300 hover:text-white hover:bg-gray-900 transition flex items-center gap-1"
              title="在播放头处分割 (S)" :class="selectedId ? '' : 'opacity-40 cursor-not-allowed'" @click="split()">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4v16l8-8zM14 12l4-8v16z"/></svg>
        <span class="hidden md:inline">分割</span>
      </button>
      <button type="button" class="px-2 py-1 rounded-md text-xs text-gray-300 hover:text-white hover:bg-gray-900 transition flex items-center gap-1"
              title="删除选中 (Del)" :class="selectedId ? '' : 'opacity-40 cursor-not-allowed'" @click="deleteSelected()">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7h12l-1 14H7z" stroke-linejoin="round"/><path d="M9 4h6l1 3H8z" stroke-linejoin="round"/></svg>
        <span class="hidden md:inline">删除</span>
      </button>
      <div class="h-4 w-px bg-gray-800 mx-1"></div>
      <!-- Snap 开关（对齐 vidonex Snap ON/OFF，N 键切换） -->
      <button type="button" data-snap="on" @click="toggleSnap()"
              class="px-2 py-1 rounded-md transition text-[10px] font-mono font-semibold snap-on"
              :class="['']" title="磁吸吸附 (N)">
        <svg class="w-3 h-3 inline mr-0.5" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h7l-1 8 10-12h-7z"/></svg>
        <span>Snap ON</span>
      </button>
    </div>
    <div class="flex items-center gap-1">
      <!-- 播放头时间（对齐 vidonex 标尺时间戳） -->
      <span class="text-[10px] font-mono text-indigo-300 w-24 text-right" x-text="fmt(playhead)"></span>
      <div class="h-4 w-px bg-gray-800 mx-1"></div>
      <!-- Zoom 控件（对齐 vidonex zoom range，驱动 像素/秒） -->
      <div class="flex items-center gap-1">
        <button type="button" class="p-1 text-gray-400 hover:text-white transition" title="缩小" @click="zoom = Math.max(0.25, zoom * 0.8)">
          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14" stroke-linecap="round"/></svg>
        </button>
        <input type="range" min="0.25" max="4" step="0.05" x-model.number="zoom"
               class="w-24 accent-indigo-500">
        <button type="button" class="p-1 text-gray-400 hover:text-white transition" title="放大" @click="zoom = Math.min(4, zoom * 1.25)">
          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="h-4 w-px bg-gray-800 mx-1"></div>
      <!-- 项目设置(画布/背景/fps,对齐 vidonex ProjectSettings) -->
      <button type="button" class="p-1.5 rounded-md text-gray-400 hover:text-white hover:bg-gray-900 transition" title="项目设置 (P)"
              @click="window.dispatchEvent(new CustomEvent('project-settings-open', { detail: { tl: tl } }))">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.6V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.03-1.6 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.6-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.6-1.03 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34 1.7 1.7 0 0 0 1.03-1.6V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.6 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87 1.7 1.7 0 0 0 1.6 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.6 1.03z"/></svg>
      </button>
    </div>
  </div>

  <!-- 项目设置弹窗(画布尺寸/背景色/fps;x-data 子作用域,事件总线驱动) -->
  <div x-data="projectSettingsModal()" x-show="open" x-cloak
       class="fixed inset-0 z-[95] flex items-center justify-center p-4"
       style="background:rgba(0,0,0,.6);backdrop-filter:blur(2px)"
       @click.self="open = false">
    <div class="w-full max-w-sm rounded-xl bg-gray-950 border border-gray-800 shadow-2xl p-5 text-gray-200">
      <h3 class="text-sm font-semibold flex items-center gap-2 mb-4">
        <svg class="w-3.5 h-3.5 text-indigo-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.6V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.03-1.6 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.6-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.6-1.03 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34 1.7 1.7 0 0 0 1.03-1.6V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.6 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87 1.7 1.7 0 0 0 1.6 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.6 1.03z"/></svg>
        项目设置
      </h3>

      <!-- 画布尺寸 -->
      <div class="mb-3.5">
        <label class="block text-[11px] text-gray-500 mb-1.5">画布尺寸</label>
        <div class="grid grid-cols-5 gap-1.5 mb-2">
          <template x-for="p in sizePresets" :key="p.id">
            <button type="button" @click="applySize(p)"
                    class="px-1 py-1 rounded border text-[9px] transition"
                    :class="width === p.width && height === p.height ? 'border-indigo-500 bg-indigo-500/10 text-indigo-300' : 'border-gray-800 text-gray-500 hover:border-gray-600'"
                    x-text="p.name.split(' ')[0]"></button>
          </template>
        </div>
        <div class="flex items-center gap-2">
          <input type="number" min="16" max="7680" x-model.number="width" class="w-full bg-gray-900 border border-gray-800 rounded px-2 py-1.5 text-[11px] font-mono text-gray-200 focus:outline-none focus:border-indigo-500">
          <span class="text-gray-500 text-xs">×</span>
          <input type="number" min="16" max="4320" x-model.number="height" class="w-full bg-gray-900 border border-gray-800 rounded px-2 py-1.5 text-[11px] font-mono text-gray-200 focus:outline-none focus:border-indigo-500">
        </div>
      </div>

      <!-- 背景色 -->
      <div class="mb-3.5">
        <label class="block text-[11px] text-gray-500 mb-1.5">背景色</label>
        <div class="flex gap-2">
          <template x-for="b in bgColors" :key="b.id">
            <button type="button" @click="background_color = b.id"
                    class="flex-1 px-2 py-1.5 rounded-lg border text-[11px] transition"
                    :class="background_color === b.id ? 'border-indigo-500 bg-indigo-500/10 text-white' : 'border-gray-800 text-gray-400 hover:border-gray-600'"
                    x-text="b.name"></button>
          </template>
        </div>
      </div>

      <!-- fps -->
      <div class="mb-4">
        <label class="block text-[11px] text-gray-500 mb-1.5">帧率</label>
        <div class="flex gap-2">
          <template x-for="f in fpsOptions" :key="f.value">
            <button type="button" @click="fps = f.value"
                    class="flex-1 px-2 py-1.5 rounded-lg border text-[11px] transition"
                    :class="fps === f.value ? 'border-indigo-500 bg-indigo-500/10 text-white' : 'border-gray-800 text-gray-400 hover:border-gray-600'"
                    x-text="f.value + ' fps'"></button>
          </template>
        </div>
      </div>

      <div class="flex justify-end gap-2">
        <button type="button" @click="open = false" class="px-3 py-1.5 rounded-lg text-xs text-gray-400 hover:bg-gray-900 transition">取消</button>
        <button type="button" @click="save()" class="px-4 py-1.5 rounded-lg text-xs font-medium bg-indigo-500 hover:bg-indigo-400 text-white transition">保存</button>
      </div>
    </div>
  </div>

  <!-- 时间轴主体 -->
  <div class="flex-1 min-h-0 overflow-auto relative" @click="seek($event)" @keydown="onKey($event)" tabindex="0">
    <div class="min-w-full inline-block" :style="'width:' + trackWidth + 'px'">
      <!-- Ruler（对齐 TimelineRuler：刻度 + 播放头三角标） -->
      <div class="h-6 border-b border-gray-800 bg-gray-950/60 relative text-[9px] font-mono text-gray-500" @click.stop="seek($event)">
        <div class="absolute inset-y-0 left-12 right-0 flex items-end overflow-hidden">
          <!-- 刻度：每 0.5s 一格（zoom 自适应） -->
          <template x-for="i in 400" :key="i">
            <div class="flex items-end size-0" :style="'margin-left:' + (pps*0.5 - 1) + 'px'">
              <template x-if="i % 4 === 0">
                <span class="block border-l border-gray-700 pl-0.5 leading-4" x-text="((i-1)*0.5).toFixed(1) + 's'"></span>
              </template>
              <template x-else>
                <span class="block border-l border-gray-800/60 leading-4"></span>
              </template>
            </div>
          </template>
        </div>
      </div>

      <!-- 轨道区 -->
      <div class="flex">
        <!-- 轨道头列（对齐 TrackHeader；点击选中轨道 → Ducking/Waveform 检查器） -->
        <div class="w-12 flex-shrink-0 border-r border-gray-800 bg-gray-950/60 z-10 relative">
          <template x-for="tr in videoTracks()" :key="'h' + tr.id">
            <div class="h-12 border-b border-gray-800/80 flex items-center justify-center cursor-pointer"
                 :class="selectedTrackId === tr.id ? 'text-indigo-400 bg-indigo-500/10' : 'text-gray-500 hover:text-gray-300'"
                 @click.stop="selectTrack(tr)">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </div>
          </template>
          <template x-for="tr in audioTracks()" :key="'h' + tr.id">
            <div class="h-12 border-b border-gray-800/80 flex items-center justify-center cursor-pointer"
                 :class="selectedTrackId === tr.id ? 'text-indigo-400 bg-indigo-500/10' : 'text-gray-500 hover:text-gray-300'"
                 @click.stop="selectTrack(tr)">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4a1 1 0 0 0 1 1h3l4 4V5L7 9H4a1 1 0 0 0-1 1z"/></svg>
            </div>
          </template>
          <template x-for="tr in otherTracks()" :key="'h' + tr.id">
            <div class="h-12 border-b border-gray-800/80 flex items-center justify-center cursor-pointer"
                 :class="selectedTrackId === tr.id ? 'text-indigo-400 bg-indigo-500/10' : 'text-gray-500 hover:text-gray-300'"
                 @click.stop="selectTrack(tr)">
              <span class="text-[9px] font-mono" x-text="tr.kind.slice(0,2)"></span>
            </div>
          </template>
        </div>

        <!-- 轨道内容 -->
        <div class="flex-1 relative">
          <!-- 每条视频/overlay 轨道一行 -->
          <template x-for="(tr, ti) in videoTracks()" :key="tr.id">
            <div class="h-12 border-b border-gray-800/80 bg-gray-950/40 relative"
                 @dragover.prevent="onTrackDragOver($event, 'video')"
                 @drop.prevent="onTrackDrop($event, 'video')">
              <template x-for="clip in tr.clips" :key="clip.id">
                <div :style="clipStyle(clip)" :class="clipClass(clip)"
                     :draggable="true"
                     @mousedown.stop="startDrag($event, clip, ti)"
                     @dragstart.stop="beginClipDnD($event, clip)"
                     @click.stop="select(clip)"
                     @dblclick.stop="">
                  <div class="absolute inset-0 flex items-center px-1.5 gap-1 pointer-events-none">
                    <svg class="w-3 h-3 text-indigo-300 flex-shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <span class="text-[10px] font-medium text-gray-100 truncate" x-text="clip.name"></span>
                  </div>
                  <!-- trim 手柄(对齐 vidonex:左右缘可拖,改时长) -->
                  <div class="absolute inset-y-0 left-0 w-1.5 cursor-ew-resize z-10 hover:bg-indigo-400/60 transition"
                       @pointerdown.stop="beginTrim($event, clip, 'left')"></div>
                  <div class="absolute inset-y-0 right-0 w-1.5 cursor-ew-resize z-10 hover:bg-indigo-400/60 transition"
                       @pointerdown.stop="beginTrim($event, clip, 'right')"></div>
                  <!-- 选中描边 -->
                  <div x-show="selectedId === clip.id"
                       class="absolute inset-0 border-2 border-indigo-400 rounded-md pointer-events-none"></div>
                  <!-- 转场句柄(对齐 vidonex TransitionHandle:右侧缘,与下个 clip 交界)
                       已有转场 = 显示类型标记(click 轮换 / dblclick 移除);
                       无 = 淡色 + 号(AppendTransition)。 -->
                  <div class="absolute top-1/2 -right-[9px] -translate-y-1/2 w-[18px] h-[18px] rounded-full z-20 flex items-center justify-center cursor-pointer border transition shadow"
                       :title="'转场: ' + (transitionOf(tr, clip) ? transitionOf(tr, clip).type : '点击添加 (dissolve)')"
                       @click.stop="$event.shiftKey ? addTransition('fadeblack', clip.id, nextClipId(tr, clip)) : cycleTransition(tr, clip)"
                       @dblclick.stop="transitionOf(tr, clip) && removeTransition(transitionOf(tr, clip).from, transitionOf(tr, clip).to)">
                    <template x-if="transitionOf(tr, clip)">
                      <span class="text-[8px] font-bold" :class="transitionColor(tr, clip)"
                            x-text="transitionOf(tr, clip).type.slice(0,3).toUpperCase()"></span>
                    </template>
                    <template x-if="!transitionOf(tr, clip)">
                      <svg class="w-2.5 h-2.5 text-gray-500" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5v14M5 12h14"/></svg>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </template>
          <!-- 音频/波形轨道 -->
          <template x-for="(tr, ti) in audioTracks()" :key="tr.id">
            <div class="h-12 border-b border-gray-800/80 bg-gray-950/40 relative"
                 @dragover.prevent="onTrackDragOver($event, 'audio')"
                 @drop.prevent="onTrackDrop($event, 'audio')">
              <template x-for="clip in tr.clips" :key="clip.id">
                <div :style="clipStyle(clip)" :class="clipClass(clip)"
                     :draggable="true"
                     @mousedown.stop="startDrag($event, clip, ti)"
                     @dragstart.stop="beginClipDnD($event, clip)"
                     @click.stop="select(clip)">
                  <div class="absolute inset-0 flex items-center px-1.5 gap-1 pointer-events-none">
                    <svg class="w-3 h-3 text-emerald-400 flex-shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4a1 1 0 0 0 1 1h3l4 4V5L7 9H4a1 1 0 0 0-1 1z"/></svg>
                    <span class="text-[10px] font-medium text-gray-300 truncate" x-text="clip.name"></span>
                  </div>
                  <!-- 音频波形(种子随机,对齐 vidonex ClipWaveform) -->
                  <canvas class="absolute inset-x-0 bottom-0 h-1/2 opacity-50 pointer-events-none"
                          :data-seed="clip.source + '-' + clip.id"
                          :data-kind="tr.kind"
                          x-init="drawWaveform($el)"></canvas>
                  <!-- trim 手柄 -->
                  <div class="absolute inset-y-0 left-0 w-1.5 cursor-ew-resize z-10 hover:bg-emerald-400/60 transition"
                       @pointerdown.stop="beginTrim($event, clip, 'left')"></div>
                  <div class="absolute inset-y-0 right-0 w-1.5 cursor-ew-resize z-10 hover:bg-emerald-400/60 transition"
                       @pointerdown.stop="beginTrim($event, clip, 'right')"></div>
                  <!-- 选中描边 -->
                  <div x-show="selectedId === clip.id"
                       class="absolute inset-0 border-2 border-emerald-400 rounded-md pointer-events-none"></div>
                </div>
              </template>
            </div>
          </template>
          <!-- 空轨道提示 -->
          <div x-show="!loading && !videoTracks().length && !audioTracks().length"
               class="absolute inset-0 flex items-center justify-center text-gray-600 text-[10px]">
            <span>轨道为空 — 从媒体库添加素材</span>
          </div>

          <!-- 播放头(对齐 TimelineRuler playhead:indigo 竖线 + 顶部圆角拖动块 + pointer 拖拽 scrub) -->
          <div class="absolute top-[-24px] bottom-0 border-l-2 border-indigo-500 z-20 cursor-ew-resize group"
               :style="'left:' + (48 + playhead * pps) + 'px'"
               @pointerdown.stop="beginScrub($event)"
               @dblclick.stop>
            <!-- 拖动块(圆角,吸附跟手):比竖线宽,点击更准 -->
            <div class="absolute -left-[7px] top-[-3px] w-4 h-3.5 rounded-t-md rounded-b-sm bg-indigo-500 shadow-md shadow-indigo-950/60 group-hover:bg-indigo-400 transition-colors"></div>
            <div class="absolute -left-[7px] top-[-3px] w-4 h-3.5 flex items-end justify-center pb-0.5">
              <svg class="w-2.5 h-2 text-white opacity-80" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v2l4 3-4 3v2h8V5z"/></svg>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 加载态 / 错误态 -->
    <div x-show="loading" class="absolute inset-0 flex items-center justify-center bg-gray-950/70 text-gray-500 text-xs">
